  /* =============== 删除墓碑 ===============
     公网显示的是静态快照，删除如果不同步出去，其他设备（旧快照）会一直显示，
     下一次同步时远端旧文章还会"复活"。所以删除要记一条墓碑（id + 删除时间），
     随快照一起传播：谁收到墓碑且文章没比墓碑更新，就不再显示这篇文章。 */
  const TOMB_KEY = 'notebook:v1:deleted';

  function getTombstones() {
    try { return JSON.parse(localStorage.getItem(TOMB_KEY) || '{}') || {}; }
    catch (e) { return {}; }
  }

  function markDeleted(id) {
    const t = getTombstones();
    t[id] = Date.now();
    localStorage.setItem(TOMB_KEY, JSON.stringify(t));
  }

  function mergeTombstones(remote) {
    const local = getTombstones();
    const out = Object.assign({}, remote || {});
    Object.keys(local).forEach(id => {
      if (!out[id] || local[id] > out[id]) out[id] = local[id];
    });
    localStorage.setItem(TOMB_KEY, JSON.stringify(out));
    return out;
  }

  function applyTombstones(posts, tombstones) {
    const t = tombstones || {};
    return (posts || []).filter(p => {
      const d = t[p.id];
      return !(d && d >= (p.updatedAt || 0));
    });
  }

  async function deletePost(p) {
    /* 索引模式下列表不带正文，先拉一次才能把这篇里的图片一并删干净 */
    if (typeof p.html !== 'string') await ensureBody(p);
    const d = document.createElement('div');
    d.innerHTML = p.html || '';
    const ids = new Set([...d.querySelectorAll('img[data-img-id]')].map(i => i.dataset.imgId));
    if (p.cover) ids.add(p.cover);
    for (const id of ids) await Store.removeImage(id);
    await Store.removePost(p.id);
    markDeleted(p.id);          /* 记录墓碑，下次同步会传播出去 */
    state.posts = state.posts.filter(x => x.id !== p.id);
  }

  /* =============== 编辑器 =============== */
  async function openEditor(id) {
    let p = state.posts.find(x => x.id === id);
    if (!p) {
      p = {
        id: id || uid(), title: '', html: '', cover: null,
        tags: [], category: DEFAULT_CAT,
        createdAt: Date.now(), updatedAt: Date.now(),
        published: true, history: [], __new: true
      };
      state.posts.unshift(p);
    }
    state.current = p;

    showView('viewEditor');
    fillCategoryOptions();
    $('#postTitle').value = p.title || '';
    $('#postCategory').value = p.category || DEFAULT_CAT;
    $('#postPublished').checked = p.published !== false;
    const ed = $('#editor');
    ed.dataset.placeholder = '从这里开始写正文…';

    if (typeof p.html === 'string') {
      ed.innerHTML = sanitize(p.html || '');
      delete p.__bodyFailed;
    } else {
      /* 索引模式：正文要单独拉。先说一声，避免编辑器看起来是空文章 */
      ed.innerHTML = '<p style="color:var(--text-mute)">正在加载正文…</p>';
      const body = await ensureBody(p);
      if (state.current !== p) return;
      if (body) {
        ed.innerHTML = sanitize(body);
        delete p.__bodyFailed;
      } else {
        /* 没拉到就必须禁止保存，否则会把提示文字当成正文覆盖掉原文 */
        p.__bodyFailed = true;
        ed.innerHTML = '<p style="color:var(--text-mute)">正文没加载出来（网络受限）。为避免覆盖原文，此时保存会被拦下；请连上网络后重新打开这篇文章。</p>';
      }
    }

    // 还原图片
    ed.querySelectorAll('img[data-img-id]').forEach(async im => {
      const url = await Store.imageUrl(im.dataset.imgId);
      if (url) im.src = url;
    });

    $('#saveState').textContent = p.createdAt
      ? `上次更新 ${fmtFull(p.updatedAt)}` : '';
    $('#btnHistory').textContent = '历史版本' + (p.history && p.history.length ? `(${p.history.length})` : '');
    ed.focus();
  }

  function exec(cmd, arg) {
    $('#editor').focus();
    try { document.execCommand(cmd, false, arg || null); } catch (e) { /* 忽略不支持的命令 */ }
  }

  /* 保存时剥掉临时 blob 地址，只留图片 id；同时做安全清理，
     避免粘贴内容里的 script / onclick 被写进存储 */
  function serializeEditor() {
    const clone = $('#editor').cloneNode(true);
    clone.querySelectorAll('img[data-img-id]').forEach(im => im.removeAttribute('src'));
    return sanitize(clone.innerHTML);
  }

  function firstImageId(html) {
    const d = document.createElement('div');
    d.innerHTML = html || '';
    const im = d.querySelector('img[data-img-id]');
    return im ? im.dataset.imgId : null;
  }

  async function savePost() {
    const p = state.current;
    if (!p) return;
    /* 正文没加载出来时禁止保存：否则编辑器里的"加载失败"提示会被当成正文覆盖原文 */
    if (p.__bodyFailed) {
      toast('正文还没加载出来，已阻止保存以免覆盖原文。请联网后重新打开这篇再改。');
      return;
    }

    const title = $('#postTitle').value.trim();
    const html = serializeEditor();
    const catRaw = String($('#postCategory').value || '').trim();

    if (!title && !plainText(html, 1)) { toast('标题和正文都还是空的'); return; }

    const titleChanged = title !== (p.title || '');
    const bodyChanged = html !== (p.html || '');
    const oldCat = p.category || DEFAULT_CAT;

    // 只有「已经存在过的文章」被改动时才留档；新建文章的首次保存不算一次修改
    if (!p.__new && (titleChanged || bodyChanged)) {
      p.history = p.history || [];
      p.history.unshift({ title: p.title || '', html: p.html || '', at: p.updatedAt || p.createdAt });
      p.history = p.history.slice(0, 30);
    }

    p.title = title || '未命名';
    p.html = html;
    p.published = $('#postPublished').checked;
    p.category = addCategory(catRaw) || DEFAULT_CAT;
    p.cover = firstImageId(html);
    p.updatedAt = Date.now();

    delete p.__new;                       // 必须在落库前清掉，否则重载后会被误判为新建
    const where = await persistPost(p);
    if (!state.posts.includes(p)) state.posts.unshift(p);

    $('#saveState').textContent = `已保存 · ${fmtFull(p.updatedAt)}` +
      (where === 'local' ? '（本机，点「同步到静态站」发布）' : '');
    $('#btnHistory').textContent = '历史版本' + (p.history && p.history.length ? `(${p.history.length})` : '');
    toast((bodyChanged || titleChanged ? '已保存，旧版本已留档' : '已保存') +
      (where === 'local' ? '（已存本机）' : ''));
  }

  function showHistory() {
    const p = state.current;
    if (!p) return;
    if (!p.history || !p.history.length) {
      openDialog('历史版本', '<p>这篇文章还没有修改过，当前就是最初版本。</p>',
        [{ text: '知道了', cls: 'primary', onClick: closeDialog }]);
      return;
    }

    const html = p.history.map((h, i) => `
      <div class="hist-item">
        <div class="hist-head">
          <span>${fmtFull(h.at)}</span>
          ${i === 0 ? '<span class="pc-draft" style="color:var(--accent);border-color:var(--accent)">上一版</span>' : ''}
          <button class="btn ghost sm" data-restore="${i}">恢复到这版</button>
        </div>
        <div class="hist-text">${esc(plainText(h.html, 200)) || '<i>（无正文）</i>'}</div>
      </div>`).join('');

    openDialog('历史版本', html, [{ text: '关闭', onClick: closeDialog }]);

    $('#dialogBody').querySelectorAll('[data-restore]').forEach(btn => {
      btn.onclick = async () => {
        const h = p.history[Number(btn.dataset.restore)];
        if (!confirm('把正文恢复到 ' + fmtFull(h.at) + ' 这一版？当前内容会先留档。')) return;
        p.history.unshift({ title: p.title || '', html: p.html || '', at: p.updatedAt || Date.now() });
        p.title = h.title || p.title;
        p.html = h.html || '';
        p.updatedAt = Date.now();
        await persistPost(p);
        closeDialog();
        openEditor(p.id);
        toast('已恢复旧版本');
      };
    });
  }

  /* =============== 图片 =============== */
  /* 上传前压缩：手机原图动辄 5~10 MB，直接存会很快撑满免费额度，
     而且快照里图片是 base64（再大 1.33 倍、还存两份）。
     默认压到长边 1800px、JPEG 质量 0.86：手机上看不出差别，体积降到 1/10 左右。 */
  const SKIP_COMPRESS_TYPES = /^image\/(gif|svg\+xml|webp)$/i;   /* 动图/矢量图不强压，避免变成静止图或失真 */

  async function compressImage(file, maxSide = 1800, quality = 0.86) {
    /* 动图与矢量图直接原样上传（GIF 一动就压没了，SVG 压了反而变大） */
    if (SKIP_COMPRESS_TYPES.test(file.type || '')) return file;
    /* 已经很小的图不再重编码，避免白白损失画质 */
    if (file.size && file.size < 200 * 1024) return file;
    try {
      const bmp = await (typeof createImageBitmap === 'function'
        ? createImageBitmap(file).catch(() => viaImg(file))
        : viaImg(file));
      const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
      const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      /* 先铺白底：透明 PNG 转 JPEG 时，透明区域会变成黑块 */
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(bmp, 0, 0, w, h);
      if (bmp.close) bmp.close();
      const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', quality));
      /* 压完反而更大（极少见，比如已经是高质量小图）就用原图 */
      return (blob && blob.size < (file.size || Infinity)) ? blob : file;
    } catch (err) {
      console.warn('[img] 压缩失败，使用原图', err);
      return file;
    }
  }

  function viaImg(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const im = new Image();
      im.onload = () => { URL.revokeObjectURL(url); resolve(im); };
      im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode fail')); };
      im.src = url;
    });
  }

  async function insertImages(files) {
    for (const f of files) {
      if (!f || !f.type || !f.type.startsWith('image/')) continue;
      const blob = await compressImage(f);
      const id = uid();
      await Store.putImage(id, blob);
      const url = await Store.imageUrl(id);
      exec('insertHTML',
        `<img data-img-id="${id}" src="${url}" alt="${esc(f.name)}"><br>`);
    }
    toast('图片已插入');
  }

  /* =============== TXT 批量导入 ===============
     选择一个或多个 .txt 文件，每个文件自动生成一篇文章：
       - 文件名去掉 .txt 作为标题
       - 正文：纯文本，按空行分段 → 多个 <p>
       - 默认分类可指定；默认已发布
     失败时要给出真实原因（数据库缺列 / 空间不足 / 网络不可达），不能只报"失败"。 */
  function sanitizeTitle(t) {
    return String(t || '').replace(/\s+/g, ' ').trim().slice(0, 120);
  }

  function txtToHtml(text) {
    const lines = String(text).split(/\r?\n/);
    let cur = [], out = [];
    const flush = () => {
      if (!cur.length) return;
      out.push('<p>' + escapeHtml(cur.join('\n')).replace(/\n/g, '<br>') + '</p>');
      cur = [];
    };
    for (const ln of lines) {
      if (ln.trim() === '') flush();
      else cur.push(ln);
    }
    flush();
    return out.join('\n') || '<p></p>';
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  async function importTxtFiles(files) {
    let list = [...files].filter(f => /\.(txt|md)$/i.test(f.name) || /text\//i.test(f.type || ''));
    if (!list.length) {
      /* 有些系统给 .txt 的 MIME 是 application/octet-stream，兜底按扩展名再筛一次 */
      list = [...files];
    }
    if (!list.length) { toast('没有读到文件，请重新选择'); return; }

    const cats = loadCategories();
    const totalKB = list.reduce((n, f) => n + (f.size || 0), 0) / 1024;
    const html = `
      <div class="tip">将导入 <b>${list.length}</b> 个文件（共 ${totalKB.toFixed(0)} KB），每个文件生成一篇独立文章。<br>可以为这批文章统一设置分类（不填则用「${esc(DEFAULT_CAT)}」）。</div>
      <div class="field"><label>这批文章的分类</label>
        <input id="txtCat" list="cat-options" value="${esc(DEFAULT_CAT)}">
        <datalist id="cat-options">${cats.map(c => '<option value="' + esc(c) + '">').join('')}</datalist>
      </div>
      <div class="field"><label>预览</label>
        <div style="font-size:12.5px;color:var(--text-mute);line-height:1.7">
          ${list.slice(0, 10).map(f => '· ' + esc(f.name) + ' <small>(' + Math.round((f.size || 0) / 1024) + ' KB)</small>').join('<br>')}
          ${list.length > 10 ? '<br>…还有 ' + (list.length - 10) + ' 个' : ''}
        </div>
      </div>
      <div class="hint">当前存储：${esc(Store.impl.label)}${Store.mode === 'local' ? '（本机浏览器上限约 5MB，超长文可能写不进去）' : ''}</div>`;
    openDialog(`导入 ${list.length} 个 TXT 文件`, html, [
      { text: '取消', onClick: closeDialog },
      {
        text: '开始导入', cls: 'primary', onClick: async () => {
          /* 必须在关闭弹窗前读输入值 */
          const cat = addCategory(($('#txtCat') && $('#txtCat').value) || DEFAULT_CAT) || DEFAULT_CAT;
          const btn = document.querySelector('#dialogFoot .btn.primary');
          if (btn) { btn.disabled = true; btn.textContent = '导入中…'; }

          let ok = 0, savedLocal = 0;
          const fails = [];
          for (const f of list) {
            try {
              const text = await f.text();
              const title = sanitizeTitle(
                f.name.replace(/\.(txt|md)$/i, '')
                  .replace(/\s*[\(（]\d+[\)）]\s*$/, '')     /* 去掉「(1)」这种重复下载后缀 */
                  .replace(/\s*[-_]?\s*副本\s*$/, '')
              ) || '未命名';
              const now = Date.now();
              const post = {
                id: uid(),
                title,
                html: txtToHtml(text),
                cover: null,
                tags: [],
                category: cat,
                createdAt: now,
                updatedAt: now,
                published: true,
                history: []
              };
              const savedTo = await persistPost(post);
              if (savedTo === 'local') savedLocal++;
              state.posts.unshift(post);
              ok++;
            } catch (e) {
              console.warn('[txt] failed:', f.name, e);
              fails.push({ name: f.name, msg: (e && e.message) || String(e) });
            }
          }

          try { await load(); } catch (e) { /* 云端读不到时保留已导入的结果 */ }

          const localTip = savedLocal
            ? `<div class="tip" style="border-color:var(--accent)">有 <b>${savedLocal}</b> 篇存在【本机】——这台设备访问不到云端数据库，已自动切到本机模式。<br>
要发布到公网，请点后台的「同步到静态站」；等能连上云端时再在「云端存储」里切回云端即可。</div>`
            : '';

          if (!fails.length) {
            closeDialog();
            renderAdmin();
            fillCategoryOptions();
            if (savedLocal) {
              openDialog('导入完成（已存本机）', `
                <p>已导入 <b>${ok}</b> 篇，分类「${esc(cat)}」。</p>
                ${localTip}
                <div class="tip">本机模式下的文章不会自动出现在公网，必须点「同步到静态站」推送。</div>`, [
                { text: '去同步', cls: 'primary', onClick: () => { closeDialog(); syncStaticSnapshot(); } },
                { text: '稍后', onClick: closeDialog }
              ]);
            } else {
              toast(`导入完成：成功 ${ok} 篇，分类「${cat}」`);
            }
            return;
          }

          /* 有失败：把真实原因摆出来，不要吞掉 */
          const detail = fails.slice(0, 5).map(x =>
            `<li><b>${esc(x.name)}</b><br><span style="color:var(--text-mute);font-size:12px">${esc(x.msg.slice(0, 300))}</span></li>`
          ).join('');
          openDialog('导入结果', `
            <p>成功 <b>${ok}</b> 篇，失败 <b style="color:var(--danger)">${fails.length}</b> 篇。</p>
            <ul style="padding-left:18px;line-height:1.9">${detail}</ul>
            ${fails.length > 5 ? `<div class="hint">仅显示前 5 条失败原因。</div>` : ''}
            ${localTip}
            <div class="tip">常见原因：① 网络访问不到云端数据库 → 已自动降级到本机，重试一次通常就成；② 本机浏览器空间不足（上限约 5MB）→ 删旧文章或改云端存储；③ 数据库字段不匹配 → 已自动兼容。</div>`, [
            { text: '知道了', cls: 'primary', onClick: closeDialog }
          ]);
          renderAdmin();
        }
      }
    ]);
  }

  /* =============== 备份 =============== */
  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }

  function base64ToBlob(b64) {
    const [meta, data] = String(b64).split(',');
    const mime = (meta.match(/:(.*?);/) || [, 'image/jpeg'])[1];
    const bin = atob(data);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }

  async function exportBackup() {
    toast('正在打包…');
    /* 索引模式下正文是按需加载的，导出备份必须先把每篇正文拉齐，否则备份里只有标题 */
    const missing = state.posts.filter(p => typeof p.html !== 'string');
    if (missing.length) {
      toast(`正在补齐 ${missing.length} 篇正文…`);
      for (const p of missing) await ensureBody(p);
    }
    const images = {};
    const ids = new Set();
    state.posts.forEach(p => {
      const d = document.createElement('div');
      d.innerHTML = p.html || '';
      [...d.querySelectorAll('img[data-img-id]')].forEach(i => ids.add(i.dataset.imgId));
      if (p.cover) ids.add(p.cover);
    });

    let failed = 0;
    for (const id of ids) {
      try {
        const blob = await Store.imageBlob(id);
        if (blob) images[id] = await blobToBase64(blob); else failed++;
      } catch (e) { failed++; }
    }

    const data = {
      format: 'notebook-backup', version: 2,
      exportedAt: new Date().toISOString(),
      posts: state.posts, images
    };
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `备份-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    toast(`备份完成（约 ${(blob.size / 1048576).toFixed(2)} MB）` + (failed ? `，${failed} 张图片失败` : ''));
  }

  async function importBackup(file) {
    try {
      const data = JSON.parse(await file.text());
      if (data.format !== 'notebook-backup') throw new Error('不是有效的备份文件');
      if (!confirm(`备份含 ${data.posts.length} 篇文章。导入会覆盖当前内容，确定继续？`)) return;
      if (Store.mode === 'local') {

      } else {

      }
      for (const [id, b64] of Object.entries(data.images || {})) {
        await Store.putImage(id, base64ToBlob(b64));
      }
      await load();
      renderAdmin();
      toast('导入完成');
    } catch (err) {
      toast('导入失败：' + err.message);
    }
  }

  /* 把图片压成正方形小头像 data URI（canvas 居中裁剪） */
  function fileToLogoDataUri(file, size) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        try {
          const c = document.createElement('canvas');
          c.width = c.height = size;
          const ctx = c.getContext('2d');
          const side = Math.min(img.width, img.height);
          ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/jpeg', 0.85));
        } catch (e) { URL.revokeObjectURL(url); reject(e); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
      img.src = url;
    });
  }

  /* 从 Supabase 直连串推导 HTTP 接口地址：
     postgresql://postgres:pw@db.<ref>.supabase.co:5432/postgres -> https://<ref>.supabase.co */
  function urlFromConnStr(s) {
    const m = /^postgres(?:ql)?:\/\/[^@]*@([^:/]+)/i.exec((s || '').trim());
    if (!m) return '';
    const ref = /^(?:db\.)?([a-z0-9]+)\.supabase\.(?:co|net|in|com)$/i.exec(m[1]);
    return ref ? ('https://' + ref[1] + '.supabase.co') : '';
  }

  /* =============== 载入 =============== */
  /* 静态快照：托管页面同目录下的 posts.json（由 GitHub Actions 定时从云端同步）。
     先读它，读者在任何网络下都能立刻看到文章；随后再拉云端拿最新版本。 */
  async function loadStaticMirror() {
    try {
      /* 打包时内联进页面的快照优先：CDN 边缘节点同步滞后时，posts.json 可能还是 404 */
      let data = window.__NB_SNAPSHOT__ || null;
      if (!data) {
        const res = await fetch('posts.json?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) return false;
        data = await res.json();
      }
      return Store.setStaticMirror(data);
    } catch (e) { return false; }
  }

  async function load() {
    state.fromMirror = false;
    state.loadError = '';
    state.posts = [];

    /* 1) 静态快照（不依赖 Supabase） */
    if (await loadStaticMirror()) {
      state.posts = Store.staticPosts();
      state.fromMirror = true;
    }

    /* 2) 云端最新（能连上就以云端为准） */
    try {
      const data = await Store.loadAll();
      if (data.posts && data.posts.length) {
        state.posts = data.posts;
        state.fromMirror = false;
      } else if (!state.posts.length) {
        state.posts = [];
      }
    } catch (e) {
      console.error(e);
      if (state.posts.length) {
        state.loadError = '';   // 已有静态快照可看，不打扰读者
      } else {
        state.loadError = '读取云端失败：' + (e && e.message ? e.message : e) +
          '。文章本身没丢，通常是这台设备的网络访问不到 Supabase（换网络试试，或进后台看「云端存储」状态）。';
      }
    }
  }

  async function publishSiteLegacy() {
    if (Store.mode !== 'cloud') {
      toast('请先启用云端存储，再发布到公网');
      cloudDialog();
      return;
    }
    const btn = $('#btnPublishSite');
    const oldText = btn.textContent;
    btn.disabled = true; btn.textContent = '发布中…';
    try {
      let html = null;
      try {
        const r = await fetch('index.html', { cache: 'no-store' });
        if (r.ok) html = await r.text();
      } catch (e) { html = null; }

      if (html) {
        const [css, stjs, apjs] = await Promise.all([
          fetch('assets/styles.css', { cache: 'no-store' }).then(r => r.text()),
          fetch('assets/storage.js', { cache: 'no-store' }).then(r => r.text()),
          fetch('assets/app.js', { cache: 'no-store' }).then(r => r.text())
        ]);
        if (/<\/script/i.test(stjs + apjs)) throw new Error('脚本内容含脚本结束标签，无法安全内联');
        /* 必须用函数式替换：源码里含 $' $& 等特殊序列，字符串替换会被解释成替换模式 */
        /* 注意：脚本正文里不能出现 "<script" 字面量，否则 HTML 解析器会进入
           double-escaped 状态，后面的结束标签就无法结束本段脚本，整页脚本会崩。
           所以这里一律用字符串拼接拼出标签。 */
        const SO = '<' + 'script>';
        const SC = '<' + '/script>';
        html = html.replace(/<link[^>]+href=["']assets\/styles\.css["'][^>]*>/, () => '<style>\n' + css + '\n</style>');
        html = html.replace(/<script[^>]+src=["']assets\/storage\.js["']\s*><\/script>/, () => SO + '\n' + stjs + '\n' + SC);
        html = html.replace(/<script[^>]+src=["']assets\/app\.js["']\s*><\/script>/, () => SO + '\n' + apjs + '\n' + SC);
      } else {
        /* 已经跑在单文件版上：直接拿当前文档，效果等价 */
        html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      }
      /* 只查标签引用：内联进来的 JS 代码里本身也有 assets/ 字样，不能用 includes 全文本匹配 */
      if (/<link[^>]+assets\/styles\.css/.test(html) || /<script[^>]+src=["'][^"']*assets\//.test(html)) {
        throw new Error('资源内联失败，页面仍引用外部文件');
      }

      /* 关键：发布的页面必须默认连云端，否则读者打开是空的（本地模式没数据） */
      const cfg = Store.getConfig();
      const inject =
        '<' + 'script>(function(){try{var k="notebook:v1:config";' +
        'var c=JSON.parse(localStorage.getItem(k)||"{}");' +
        'if(!c.enabled||!c.url||!c.key){localStorage.setItem(k,JSON.stringify({' +
        'enabled:true,url:' + JSON.stringify(cfg.url || '') +
        ',key:' + JSON.stringify(cfg.key || '') +
        ',bucket:' + JSON.stringify(cfg.bucket || 'notebook-images') +
        '}));}}catch(e){}})();<' + '/script>\n';
      html = html.includes('</head>')
        ? html.replace('</head>', inject + '</head>')
        : inject + html;

      const url = await Store.publishFile('index.html', html, 'text/html; charset=utf-8');
      openDialog('发布成功', `
        <p>你的站点已经有公网地址了，把这个发给读者：</p>
        <div class="field">
          <input id="pubUrl" value="${esc(url)}" readonly onclick="this.select()">
        </div>
        <div class="tip">文章内容不需要重新发布——文章存在数据库里，保存后读者刷新即可看到。
只有当我改了站点功能（比如加了新按钮），你才需要再点一次「发布到公网」覆盖更新。</div>`, [
        {
          text: '复制地址', onClick: async () => {
            try { await navigator.clipboard.writeText(url); toast('已复制'); }
            catch (e) { $('#pubUrl').select(); toast('请按 Ctrl+C 复制'); }
          }
        },
        { text: '打开看看', onClick: () => window.open(url, '_blank') },
        { text: '关闭', cls: 'primary', onClick: closeDialog }
      ]);
    } catch (e) {
      openDialog('发布失败', `
        <p style="color:var(--danger)">${esc(e.message)}</p>
        <div class="tip">常见原因：① 登录已过期，退出重新登录一次；② 图片桶策略未放行你的账号，需重新执行 README 里的图片策略 SQL 并把邮箱换成你登录用的邮箱。</div>`, [
        { text: '知道了', cls: 'primary', onClick: closeDialog }
      ]);

    }

  /* =============== 同步到静态站 =============== */
  /* 把已发布文章（含图片）写成 posts.json 提交到 GitHub 仓库。
     目的：部分网络访问不到 Supabase，读者打开页面时会回退读这份快照，
     照样能看到文章。写的是普通文件，GitHub token 只需 repo 权限。 */
  const GH_REPO = 'youxiang-wanjuwu/youxiang-wanjuwu.github.io';
  const GH_TOKEN_KEY = 'notebook:v1:ghtoken';

  function utf8ToB64(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  /* 用 GitHub Contents API 写/覆盖仓库里的一个文件 */
  async function ghPut(token, repoPath, text, message) {
    const api = 'https://api.github.com/repos/' + GH_REPO + '/contents/' + repoPath;
    const headers = {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    };
    let sha = null;
    const cur = await fetch(api, { headers });
    if (cur.ok) { const j = await cur.json(); sha = j.sha || null; }
    const body = { message: message, content: utf8ToB64(text), branch: 'main' };
    if (sha) body.sha = sha;
    const res = await fetch(api, { method: 'PUT', headers, body: JSON.stringify(body) });
    if (res.status === 401 || res.status === 403) {
      const err = new Error('GitHub 拒绝了这个 token（需要 repo 权限，或已过期）。请重新生成一个再试。');
      err.badToken = true;
      throw err;
    }
    if (!res.ok) throw new Error('GitHub 返回 ' + res.status + '：' + (await res.text()).slice(0, 200));
    return true;
  }

  function blobToDataUri(blob) {
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = rej;
      fr.readAsDataURL(blob);
    });
  }

  /* 读取 GitHub 上已有的快照（base64） */
  async function ghGetSnapshot(token) {
    try {
      const api = 'https://api.github.com/repos/' + GH_REPO + '/contents/posts.json';
      const r = await fetch(api, {
        headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' }
      });
      if (!r.ok) return null;
      const j = await r.json();
      const b64 = (j.content || '').replace(/\s/g, '');
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return JSON.parse(new TextDecoder().decode(bytes));
    } catch (e) { return null; }
  }

  /* 读取仓库里任意 JSON 文件（articles/<id>.json 等） */
  async function ghGetJson(token, repoPath) {
    try {
      const r = await fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + repoPath, {
        headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' }
      });
      if (!r.ok) return null;
      const j = await r.json();
      const bin = atob((j.content || '').replace(/\s/g, ''));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return JSON.parse(new TextDecoder().decode(bytes));
    } catch (e) { return null; }
  }

  /* 列出仓库某个目录的文件名；目录不存在时返回空集合（不报错） */
  async function ghListDir(token, dir) {
    try {
      const r = await fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + dir, {
        headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' }
      });
      if (!r.ok) return new Set();
      const arr = await r.json();
      if (!Array.isArray(arr)) return new Set();
      return new Set(arr.filter(x => x.type === 'file').map(x => x.name));
    } catch (e) { return new Set(); }
  }

  async function syncStaticSnapshot() {
    let token = (localStorage.getItem(GH_TOKEN_KEY) || '').trim();
    if (!token) {
      const input = window.prompt(
        '输入 GitHub token（只保存在这台设备的浏览器里，之后不再询问）\n\n' +
        '需要：github.com → Settings → Developer settings → Personal access tokens → Tokens (classic) → 勾选 repo\n\n' +
        '留空则取消。');
      if (!input) return;
      token = input.trim();
      if (!token) return;
      localStorage.setItem(GH_TOKEN_KEY, token);
    }

    const btn = $('#btnSyncStatic');
    const oldText = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = '同步中…'; }
    try {
      /* 1) 本机 / 云端文章（云端连不上时退回页面自带快照） */
      let mine = [];
      try { mine = (await Store.loadAll()).posts || []; }
      catch (e) { mine = state.posts || []; }
      mine = mine.filter(p => p.published);
      /* 索引模式下列表不带正文，先把要发布的正文补齐，否则会推上去空文章 */
      for (const p of mine) {
        if (typeof p.html !== 'string') await ensureBody(p);
      }

      /* 2) 远端已有的索引 + articles 目录清单（用来判断哪篇真的变了） */
      const remote = await ghGetSnapshot(token);
      const tombstones = mergeTombstones(remote && remote.deleted);
      const remoteIdx = new Map(((remote && remote.posts) || []).map(p => [p.id, p]));
      const artFiles = await ghListDir(token, 'articles');

      /* 3) 合并：同一篇以 updatedAt 大者为准，避免覆盖别的设备发过的文章 */
      const merged = new Map();
      ((remote && remote.posts) || []).forEach(p => merged.set(p.id, p));
      mine.forEach(p => {
        const old = merged.get(p.id);
        if (!old || (p.updatedAt || 0) >= (old.updatedAt || 0)) merged.set(p.id, p);
      });
      const posts = applyTombstones([...merged.values()], tombstones)
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

      /* 4) 远端赢但只是索引（没有正文）的，从 articles/<id>.json 取回正文 */
      let noBody = 0;
      for (const p of posts) {
        if (typeof p.html === 'string') continue;
        let got = false;
        if (artFiles.has(p.id + '.json')) {
          const art = await ghGetJson(token, 'articles/' + p.id + '.json');
          if (art && typeof art.html === 'string') {
            p.html = art.html;
            p.history = art.history || p.history;
            got = true;
          }
        }
        if (!got) noBody++;
      }

      /* 5) 正文逐篇写 articles/<id>.json，内容没变的不重复推。
         关键：如果本地拿不到正文、但仓库里已经有这篇的正文文件，
         必须把远端那条索引原样保留，否则会把别人的文章从线上删掉。 */
      let pushed = 0;
      const keep = [];
      for (const p of posts) {
        const file = p.id + '.json';
        const hasRemoteBody = artFiles.has(file);

        if (typeof p.html !== 'string') {
          if (hasRemoteBody) keep.push(p);   /* 正文在仓库里，索引沿用远端那份 */
          continue;
        }

        keep.push(p);
        const rIdx = remoteIdx.get(p.id);
        const changed = !hasRemoteBody || !rIdx || (rIdx.updatedAt || 0) !== (p.updatedAt || 0);
        if (!changed) continue;
        const art = {
          id: p.id,
          title: p.title || '未命名',
          updatedAt: p.updatedAt,
          html: p.html,
          history: p.history || []
        };
        await ghPut(token, 'articles/' + file, JSON.stringify(art), '文章 ' + p.id);
        pushed++;
      }

      /* 6) 索引：只有标题/摘要/时间/分类，几 KB 级别，读者首屏只下这一份 */
      const index = keep.map(p => ({
        id: p.id,
        title: p.title || '未命名',
        category: p.category || DEFAULT_CAT,
        createdAt: p.createdAt || 0,
        updatedAt: p.updatedAt || 0,
        published: p.published !== false,
        cover: p.cover || null,
        excerpt: postExcerpt(p, 120),
        /* 远端索引项没有正文，字数要沿用原值，别被覆盖成 0 */
        words: typeof p.html === 'string' ? plainText(p.html, 0).length : (p.words || 0),
        art: 'articles/' + p.id + '.json'
      }));

      /* 7) 图片仍转 data URI，保证连不上云端的设备也能看到图 */
      const ids = new Set();
      keep.forEach(p => {
        if (p.cover) ids.add(p.cover);
        (p.html || '').replace(/data-img-id="([^"]+)"/g, (_, id) => { ids.add(id); return _; });
      });
      const dataUris = Object.assign({}, (remote && remote.dataUris) || {});
      for (const id of ids) {
        if (dataUris[id]) continue;
        try {
          const blob = await Store.imageBlob(id);
          if (blob) dataUris[id] = await blobToDataUri(blob);
        } catch (e) { /* 单张失败不影响整体 */ }
      }

      /* 8) 合并结果写回本机，保证这台设备上的列表也是最全的 */
      if (Store.mode === 'local') {
        for (const p of keep) {
          try { await Store.putPost(p); } catch (e) { /* 空间不足就跳过，不阻断发布 */ }
        }
      }

      /* 9) 站点设置与分类：本机自定义优先，分类做本机 ↔ 远端并集 */
      const st = Store.getSettings();
      const localCustom = (st.siteName && st.siteName !== '我的文字站') || st.intro || st.logo;
      const site = localCustom
        ? { siteName: st.siteName || '', intro: st.intro || '', logo: st.logo || '' }
        : ((remote && remote.site) || undefined);
      const localCats = loadCategories();
      const remoteCats = (remote && remote.categories) || [];
      const mergedCats = [...new Set([DEFAULT_CAT, ...remoteCats, ...localCats])];

      const snapshot = {
        v: 2,
        generatedAt: new Date().toISOString(),
        imgBase: 'img/',
        artBase: 'articles/',
        images: [],
        dataUris,
        site,
        categories: mergedCats,
        deleted: tombstones,
        posts: index
      };

      const msg = '同步文章快照 ' + new Date().toISOString();
      await ghPut(token, 'posts.json', JSON.stringify(snapshot), msg);

      /* 10) 索引同时内联进 index.html：读者首屏一个请求就有内容 */
      let inlined = false;
      try {
        const pageRes = await fetch('index.html', { cache: 'no-store' });
        if (pageRes.ok) {
          let page = await pageRes.text();
          /* 不能写 "<script" 字面量（会破坏内联脚本解析），用拼接 */
          const OPEN = '<' + 'script id="nb-snapshot">';
          const CLOSE = '<' + '/script>';
          const block = OPEN + 'window.__NB_SNAPSHOT__=' +
            JSON.stringify(snapshot).replace(/<\//g, '<\\/') + ';' + CLOSE + '\n';
          const re = new RegExp('<s' + 'cript id="nb-snapshot">[\\s\\S]*?' + CLOSE, 'i');
          page = re.test(page) ? page.replace(re, () => block) : page.replace('</head>', block + '</head>');
          await ghPut(token, 'index.html', page, msg);
          inlined = true;
        }
      } catch (e) { /* index.html 更新失败不阻断，posts.json 已生效 */ }

      const idxKb = Math.max(1, Math.round(JSON.stringify(index).length / 1024));
      openDialog('已同步到静态站', `
        <p>已发布 <b>${keep.length}</b> 篇（其中 <b>${pushed}</b> 篇正文有更新，其余未变、未重复上传）。</p>
        <p>读者首屏只需下载 <b>${idxKb} KB</b> 的文章目录，点开哪篇才加载哪篇正文，<b>${Object.keys(dataUris).length}</b> 张图片随目录一起带上。</p>
        ${noBody ? `<div class="tip" style="border-color:#ff6b6b">有 ${noBody} 篇没拿到正文，本次已跳过（不会覆盖线上已有的内容）。通常是网络受限，连上网络后再同步一次即可。</div>` : ''}
        <div class="tip">约 1 分钟后生效。以后发新文章，再点一次这个按钮即可。</div>`, [
        { text: '打开公网看看', onClick: () => window.open('https://youxiang-wanjuwu.github.io/', '_blank') },
        { text: '好', cls: 'primary', onClick: closeDialog }
      ]);
    } catch (e) {
      if (e && e.badToken) localStorage.removeItem(GH_TOKEN_KEY);
      toast('同步失败：' + (e && e.message ? e.message : e));
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = oldText; }
    }
  }

  function bind() {
    $('#btnManage').onclick = () => requireAuth(() => go('#/admin'));
    $('#btnNewPost').onclick = () => go('#/edit/' + uid());
    $('#btnBackAdmin').onclick = () => go('#/admin');
    $('#btnLogout').onclick = () => {
      state.authed = false;
      sessionStorage.removeItem('notebook:v1:auth');
      go('#/');
      toast('已退出');
    };

    $('#btnSiteCfg').onclick = siteDialog;
    $('#btnManageCats').onclick = categoryDialog;
    if ($('#btnImportTxt')) $('#btnImportTxt').onclick = () => $('#txtInput').click();
    $('#btnPublishSite').onclick = publishSite;
    if ($('#btnSyncStatic')) $('#btnSyncStatic').onclick = syncStaticSnapshot;
    $('#btnCloudCfg').onclick = cloudDialog;
    $('#btnBackup').onclick = exportBackup;
    $('#btnRestore').onclick = () => $('#restoreInput').click();
    $('#restoreInput').onchange = (e) => {
      if (e.target.files[0]) importBackup(e.target.files[0]);
      e.target.value = '';
    };
    $('#txtInput').onchange = (e) => {
      if (e.target.files.length) importTxtFiles(e.target.files);
      e.target.value = '';
    };
    if ($('#btnBulkMove')) $('#btnBulkMove').onclick = bulkChangeCategory;
    if ($('#btnBulkUncheck')) $('#btnBulkUncheck').onclick = () => {
      state._selected = new Set();
      renderAdmin(true);
      toast('已清空选择');
    };

    // 编辑器
    $('#btnSave').onclick = savePost;
    $('#btnSaveBottom').onclick = savePost;
    $('#btnHistory').onclick = showHistory;
    $('#postTitle').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#editor').focus(); } };

    $('#toolbar').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.cmd) exec(b.dataset.cmd, b.dataset.arg);
      else if (b.dataset.block) {
        const v = b.dataset.block;
        exec('formatBlock', v === 'p' ? '<p>' : '<' + v + '>');
      }
    });

    $('#btnLink').onclick = () => {
      const url = prompt('输入链接地址（记得带 https://）');
      if (!url) return;
      exec('createLink', url);
    };

    $('#btnImage').onclick = () => $('#fileInput').click();
    $('#fileInput').onchange = (e) => { insertImages(e.target.files); e.target.value = ''; };

    const ed = $('#editor');
    ed.addEventListener('paste', (e) => {
      const items = (e.clipboardData && e.clipboardData.items) || [];
      const files = [];
      for (const it of items) if (it.type && it.type.startsWith('image/')) files.push(it.getAsFile());
      if (files.length) { e.preventDefault(); insertImages(files); }
    });

    const area = $('.editor-area');
    ['dragenter', 'dragover'].forEach(t => area.addEventListener(t, (e) => {
      e.preventDefault(); area.classList.add('dragover');
    }));
    ['dragleave', 'drop'].forEach(t => area.addEventListener(t, () => area.classList.remove('dragover')));
    area.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer && e.dataTransfer.files.length) insertImages(e.dataTransfer.files);
    });

    ed.addEventListener('keydown', (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;
      if (e.key === 's') { e.preventDefault(); savePost(); }
      else if (e.key === 'b') { e.preventDefault(); exec('bold'); }
      else if (e.key === 'i') { e.preventDefault(); exec('italic'); }
    });

    // 主题
    $('#btnTheme').onclick = () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      localStorage.setItem('notebook:v1:theme', next);
    };

    // 弹窗关闭
    document.querySelectorAll('[data-close]').forEach(el => {
      el.onclick = () => { closeDialog(); $('#lightbox').hidden = true; };
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeDialog(); $('#lightbox').hidden = true; }
    });

    window.addEventListener('hashchange', route);
  }

  /* =============== 启动 =============== */
  /* 注册离线缓存：第一次访问后，页面/文章/图片都留在本地，
     之后即使断网或访问不到托管站点，也能正常阅读 */
  function registerOfflineCache() {
    if (!('serviceWorker' in navigator)) return;
    if (!/^https?:$/.test(location.protocol)) return;
    navigator.serviceWorker.register('sw.js').catch(() => { /* 不支持就算了，不影响使用 */ });
  }

  (async function boot() {
    const theme = localStorage.getItem('notebook:v1:theme');
    if (theme) document.documentElement.dataset.theme = theme;

    registerOfflineCache();
    bind();
    await Store.init();
    await load();
    await route();
  })();
})();

</script>
</body>
</html>
