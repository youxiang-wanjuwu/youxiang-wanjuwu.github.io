  <!-- 分类筛选 + 批量操作条 -->
  <div class="cat-toolbar">
    <div class="cat-filter-row" id="catFilterRow"></div>
    <div class="bulk-toolbar" id="bulkToolbar" hidden>
      <span><b id="selCount">0</b> 篇已选</span>
      <button class="btn ghost sm" id="btnBulkMove">批量改分类</button>
      <button class="btn ghost sm" id="btnBulkUncheck">取消选择</button>
    </div>
  </div>

  <div class="admin-list" id="adminList"></div>
</main>

<!-- ============ 编辑器 ============ -->
<main class="page" id="viewEditor" hidden>
  <div class="editor-bar">
    <button id="btnBackAdmin" class="btn ghost sm">← 返回后台</button>
    <input id="postTitle" class="editor-title" placeholder="文章标题" spellcheck="false">
    <input id="postCategory" class="editor-category" list="catOptions" placeholder="选择/输入分类" spellcheck="false">
    <datalist id="catOptions"></datalist>
    <div class="editor-bar-right">
      <label class="switch">
        <input type="checkbox" id="postPublished" checked>
        <span>已发布</span>
      </label>
      <button id="btnSave" class="btn primary sm">保存</button>
    </div>
  </div>

  <div class="toolbar" id="toolbar">
    <button data-cmd="bold" title="加粗"><b>B</b></button>
    <button data-cmd="italic" title="斜体"><i>I</i></button>
    <button data-cmd="underline" title="下划线"><u>U</u></button>
    <span class="tb-sep"></span>
    <button data-block="h2" title="大标题">H2</button>
    <button data-block="h3" title="小标题">H3</button>
    <button data-block="p" title="正文">正文</button>
    <span class="tb-sep"></span>
    <button data-cmd="insertUnorderedList" title="无序列表">• 列表</button>
    <button data-cmd="insertOrderedList" title="有序列表">1. 列表</button>
    <button data-cmd="formatBlock" data-arg="blockquote" title="引用">❝ 引用</button>
    <span class="tb-sep"></span>
    <button id="btnLink" title="插入链接">🔗 链接</button>
    <button id="btnImage" title="插入图片">🖼 图片</button>
    <button data-cmd="removeFormat" title="清除格式">清除</button>
    <span class="tb-sep"></span>
    <button id="btnHistory" title="历史版本">历史版本</button>
  </div>

  <div class="editor-area">
    <div id="editor" contenteditable="true" spellcheck="false"></div>
  </div>
  <div class="editor-foot">
    <span id="saveState" class="hint">支持 Ctrl+B 加粗、Ctrl+I 斜体；图片可直接粘贴或拖入</span>
    <button id="btnSaveBottom" class="btn primary">保存文章</button>
  </div>
</main>

<!-- ============ 弹窗 ============ -->
<div class="modal" id="dialog" hidden>
  <div class="modal-mask" data-close></div>
  <div class="dialog-box">
    <div class="dialog-head">
      <h3 id="dialogTitle">标题</h3>
      <button class="icon-btn" data-close>✕</button>
    </div>
    <div class="dialog-body" id="dialogBody"></div>
    <div class="dialog-foot" id="dialogFoot"></div>
  </div>
</div>

<div class="modal" id="lightbox" hidden>
  <div class="modal-mask" data-close></div>
  <img class="lightbox-img" id="lightboxImg" alt="预览">
  <button class="lightbox-close" data-close>✕</button>
</div>

<input id="fileInput" type="file" accept="image/*" multiple hidden>
<input id="restoreInput" type="file" accept="application/json" hidden>
<input id="txtInput" type="file" accept=".txt,text/plain" multiple hidden>
