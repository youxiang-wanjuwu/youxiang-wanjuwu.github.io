<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的文字站</title>
<style>
:root {
  --bg: #0f1216;
  --bg-soft: #151a21;
  --panel: #1a2029;
  --panel-2: #212935;
  --line: #2b3441;
  --text: #e6ebf2;
  --text-dim: #9aa8bd;
  --text-mute: #6b7a8f;
  --accent: #4f8cff;
  --accent-soft: rgba(79, 140, 255, .14);
  --danger: #ef5b5b;
  --ok: #35c07f;
  --radius: 12px;
  --shadow: 0 8px 28px rgba(0, 0, 0, .38);
  --read-width: 720px;
}

[data-theme="light"] {
  --bg: #f7f8fb;
  --bg-soft: #eef1f6;
  --panel: #ffffff;
  --panel-2: #f5f7fb;
  --line: #e2e7f0;
  --text: #1b2330;
  --text-dim: #556174;
  --text-mute: #8b96a8;
  --accent: #2f6ff2;
  --accent-soft: rgba(47, 111, 242, .1);
  --shadow: 0 8px 26px rgba(20, 35, 60, .09);
}

* { box-sizing: border-box; }

/* hidden 必须绝对生效：否则 .modal 的 display:grid 会压过 UA 的 display:none，
   弹窗和遮罩会常驻页面顶层，挡住一切点击 */
[hidden] { display: none !important; }

html, body { height: 100%; margin: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  display: flex;
  flex-direction: column;
}

/* ---------------- 顶栏 ---------------- */
.topbar {
  flex: 0 0 auto;
  height: 58px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 22px;
  background: var(--bg-soft);
  border-bottom: 1px solid var(--line);
}

.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }

.logo {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--accent), #7aa8ff);
  color: #fff; font-weight: 700; font-size: 15px;
}

.brand-text { display: flex; flex-direction: column; line-height: 1.25; }
.brand-text strong { font-size: 15px; }
.brand-text small { color: var(--text-mute); font-size: 11.5px; }

.topbar-actions { margin-left: auto; display: flex; gap: 8px; }

/* ---------------- 按钮 ---------------- */
.btn {
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  padding: 8px 14px;
  border-radius: 9px;
  font-size: 13px;
  cursor: pointer;
  transition: .16s;
  white-space: nowrap;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); color: #fff; }
.btn.danger { border-color: transparent; background: transparent; color: var(--danger); }
.btn.danger:hover { background: rgba(239, 91, 91, .12); color: var(--danger); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 11px; font-size: 12.5px; }
.btn.icon { padding: 8px 11px; }

.icon-btn { background: none; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; padding: 4px 8px; }
.icon-btn:hover { color: var(--text); }

/* ---------------- 页面容器 ---------------- */
.page {
  flex: 1;
  overflow-y: auto;
  padding: 34px 22px 90px;
}

/* ---------------- 首页列表 ---------------- */
.home-head {
  max-width: 760px;
  margin: 0 auto 30px;
}
.home-head h1 { font-size: 27px; margin: 0 0 6px; letter-spacing: -.3px; }
.home-head p { margin: 0; color: var(--text-mute); font-size: 14px; }

.post-list { max-width: 760px; margin: 0 auto; }

.post-card {
  display: block;
  text-decoration: none;
  color: inherit;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 14px;
  transition: .18s;
}
.post-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow); }

.post-card h2 { margin: 0 0 7px; font-size: 19.5px; letter-spacing: -.2px; }
.post-card .pc-excerpt {
  color: var(--text-dim);
  font-size: 14.5px;
  line-height: 1.75;
  margin: 0 0 12px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.post-card .pc-meta { font-size: 12.5px; color: var(--text-mute); display: flex; gap: 12px; }
.post-card .pc-cover {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 9px;
  margin-bottom: 14px;
}
.post-card .pc-draft {
  color: var(--danger);
  border: 1px solid currentColor;
  border-radius: 5px;
  padding: 0 6px;
  font-size: 11px;
}

.home-empty { text-align: center; padding: 70px 20px; color: var(--text-mute); }
.home-empty p { font-size: 16px; margin: 0 0 6px; color: var(--text-dim); }

/* ---------------- 文章正文（阅读体验核心） ---------------- */
.article { max-width: var(--read-width); margin: 0 auto; }

.back-link {
  display: inline-block;
  color: var(--text-mute);
  text-decoration: none;
  font-size: 13.5px;
  margin-bottom: 18px;
}
.back-link:hover { color: var(--accent); }

.article-title {
  font-size: 32px;
  line-height: 1.35;
  margin: 0 0 12px;
  letter-spacing: -.6px;
  font-weight: 700;
}

.article-meta {
  font-size: 13px;
  color: var(--text-mute);
  padding-bottom: 22px;
  margin-bottom: 30px;
  border-bottom: 1px solid var(--line);
}

.article-body {
  font-size: 17px;
  line-height: 1.9;
  color: var(--text);
  word-break: break-word;
}
.article-body > *:first-child { margin-top: 0; }
.article-body p { margin: 0 0 1.15em; }
.article-body h2 {
  font-size: 23px; line-height: 1.45;
  margin: 2em 0 .8em;
  letter-spacing: -.3px;
}
.article-body h3 { font-size: 19px; margin: 1.7em 0 .7em; }
.article-body h4 { font-size: 16.5px; margin: 1.5em 0 .6em; }
.article-body a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
.article-body a:hover { border-bottom-color: var(--accent); }
.article-body strong { font-weight: 700; }

.article-body img {
  max-width: 100%;
  height: auto;
  border-radius: 10px;
  display: block;
  margin: 1.6em auto;
  cursor: zoom-in;
  background: var(--panel-2);
}

.article-body blockquote {
  margin: 1.5em 0;
  padding: 2px 0 2px 16px;
  border-left: 3px solid var(--accent);
  color: var(--text-dim);
  font-size: 16px;
}
.article-body blockquote p:last-child { margin-bottom: 0; }

.article-body ul, .article-body ol { margin: 0 0 1.15em; padding-left: 1.5em; }
.article-body li { margin-bottom: .45em; }
.article-body li > ul, .article-body li > ol { margin: .45em 0 0; }

.article-body code {
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  font-size: .88em;
  background: var(--panel-2);
  padding: 2px 6px;
  border-radius: 5px;
}
.article-body pre {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 14px 16px;
  overflow-x: auto;
  margin: 1.5em 0;
}
.article-body pre code { background: none; padding: 0; font-size: 13.5px; }

.article-body hr { border: none; border-top: 1px solid var(--line); margin: 2.4em 0; }

.article-foot {
  margin-top: 46px;
  padding-top: 22px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 10px;
  align-items: center;
}

/* ---------------- 后台 ---------------- */
.admin-head {
  max-width: 860px; margin: 0 auto 18px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.admin-head h1 { font-size: 24px; margin: 0; }
.admin-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

.admin-hint {
  max-width: 860px; margin: 0 auto 16px;
  font-size: 12.5px; color: var(--text-mute);
  display: flex; align-items: center; gap: 6px;
}
.admin-hint .status-dot.on { background: var(--ok); }
.admin-hint .status-dot.off { background: var(--text-mute); }

.admin-list { max-width: 860px; margin: 0 auto; }
.admin-item {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 15px 18px;
  margin-bottom: 11px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.admin-item .ai-main { flex: 1; min-width: 0; }
.admin-item .ai-title { font-size: 15.5px; font-weight: 600; margin-bottom: 3px; }
.admin-item .ai-sub { font-size: 12.5px; color: var(--text-mute); }
.admin-item .ai-ops { display: flex; gap: 7px; }

/* ---------------- 编辑器 ---------------- */
.editor-bar {
  max-width: 820px; margin: 0 auto 14px;
  display: flex; align-items: center; gap: 12px;
}
.editor-title {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  border-radius: 9px;
  padding: 9px 13px;
  font-size: 17px;
  font-weight: 600;
  outline: none;
}
.editor-title:focus { border-color: var(--accent); }
.editor-bar-right { display: flex; align-items: center; gap: 12px; }

.switch { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-dim); cursor: pointer; }

.toolbar {
  max-width: 820px; margin: 0 auto 10px;
  display: flex; flex-wrap: wrap; gap: 4px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 7px 9px;
}
.toolbar button {
  border: none;
  background: transparent;
  color: var(--text-dim);
  padding: 6px 10px;
  border-radius: 7px;
  font-size: 13px;
  cursor: pointer;
}
.toolbar button:hover { background: var(--panel-2); color: var(--text); }
.tb-sep { width: 1px; background: var(--line); margin: 4px 5px; }

.editor-area {
  max-width: 820px; margin: 0 auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.editor-area.dragover { border-color: var(--accent); background: var(--accent-soft); }

#editor {
  min-height: 420px;
  padding: 22px 26px;
  outline: none;
  font-size: 16.5px;
  line-height: 1.85;
  color: var(--text);
}
#editor:empty::before {
  content: attr(data-placeholder);
  color: var(--text-mute);
}
#editor p { margin: 0 0 1em; }
#editor h2 { font-size: 22px; margin: 1.6em 0 .7em; }
#editor h3 { font-size: 18px; margin: 1.4em 0 .6em; }
#editor img { max-width: 100%; border-radius: 9px; display: block; margin: 1.2em auto; }
#editor blockquote {
  margin: 1.2em 0; padding-left: 15px;
  border-left: 3px solid var(--accent); color: var(--text-dim);
}
#editor ul, #editor ol { padding-left: 1.5em; }

.editor-foot {
  max-width: 820px; margin: 14px auto 0;
  display: flex; align-items: center; gap: 14px;
}
.editor-foot .hint { font-size: 12.5px; color: var(--text-mute); }
.editor-foot .btn { margin-left: auto; }

/* ---------------- 弹窗 ---------------- */
.modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; }
.modal-mask { position: absolute; inset: 0; background: rgba(0, 0, 0, .6); }

.dialog-box {
  position: relative;
  width: min(560px, 92vw);
  max-height: 84vh;
  display: flex; flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
}
.dialog-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
}
.dialog-head h3 { margin: 0; font-size: 15px; }
.dialog-body { padding: 16px; overflow-y: auto; font-size: 13.5px; }
.dialog-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }

.field { margin-bottom: 13px; }
.field label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 5px; }
.field input, .field textarea {
  width: 100%;
  padding: 9px 11px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  font: inherit; font-size: 13.5px;
  outline: none;
  resize: vertical;
}
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.field .tip { font-size: 11.5px; color: var(--text-mute); margin-top: 5px; }

.hist-item {
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 11px 13px;
  margin-bottom: 9px;
  background: var(--panel-2);
}
.hist-head { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-mute); margin-bottom: 6px; }
.hist-head button { margin-left: auto; }
.hist-text {
  font-size: 13px; color: var(--text-dim);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}

.status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--text-mute); margin-right: 5px; }

.lightbox-img { position: relative; max-width: 90vw; max-height: 88vh; border-radius: 10px; box-shadow: var(--shadow); }
.lightbox-close {
  position: absolute; top: 22px; right: 26px;
  width: 36px; height: 36px; border-radius: 50%;
  border: none; background: rgba(255, 255, 255, .16);
  color: #fff; font-size: 16px; cursor: pointer;
}

.toast {
  position: fixed; left: 50%; bottom: 34px;
  transform: translateX(-50%);
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 10px 20px;
  border-radius: 999px;
  box-shadow: var(--shadow);
  font-size: 13px;
  z-index: 200;
  animation: rise .22s ease;
}
@keyframes rise { from { opacity: 0; transform: translate(-50%, 10px); } }

@media (max-width: 700px) {
  .page { padding: 22px 16px 70px; }
  .article-title { font-size: 25px; }
  .article-body { font-size: 16.5px; }
  .editor-bar { flex-wrap: wrap; }
  .admin-actions { margin-left: 0; }
}

</style>

<script>
/* =========================================================
 * storage.js —— 统一存储层
 * 两种后端，接口完全一致：
 *   LocalStore : localStorage(文章数据) + IndexedDB(图片二进制)
 *   CloudStore : Supabase —— PostgREST(文章数据) + Storage(图片)
 * 上层只依赖 Store.xxx，切换后端无需改动界面代码。
 *
 * 文章模型 post = {
 *   id, title, html, cover, tags[], createdAt, updatedAt,
 *   published, history:[{title, html, at}]
 * }
 * ========================================================= */
(function (global) {
  'use strict';

  const NS = 'notebook:v1';
  const LS_POSTS = NS + ':posts';
  const LS_SETTINGS = NS + ':settings';
  const LS_CONFIG = NS + ':config';
  const LS_AUTH = NS + ':authsess';

  /* ---------------- 小工具 ---------------- */
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function readLS(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      console.warn('[storage] 读取失败:', key, e);
      return fallback;
    }
  }

  function writeLS(key, val) {
    try {
      localStorage.setItem(key, JSON.stringify(val));
      return true;
    } catch (e) {
      console.error('[storage] 写入失败:', key, e);
      alert('本地存储空间不足，建议清理旧文章或改用云端存储。');
      return false;
    }
  }

  /* ---------------- IndexedDB 封装（存图片二进制） ---------------- */
  const idb = {
    _db: null,
    open() {
      if (this._db) return Promise.resolve(this._db);
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(NS, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('images')) db.createObjectStore('images');
        };
        req.onsuccess = () => { this._db = req.result; resolve(this._db); };
        req.onerror = () => reject(req.error);
      });
    },
    async put(key, val) {
      const db = await this.open();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('images', 'readwrite');
        tx.objectStore('images').put(val, key);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    },
    async get(key) {
      const db = await this.open();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('images', 'readonly');
        const r = tx.objectStore('images').get(key);
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
    },
    async del(key) {
      const db = await this.open();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('images', 'readwrite');
        tx.objectStore('images').delete(key);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }
  };

  /* ---------------- 本地后端 ---------------- */
  const LocalStore = {
    mode: 'local',
    label: '本地浏览器',
    _blobUrls: new Map(),

    async init() { return true; },

    async loadAll() { return { posts: readLS(LS_POSTS, []) }; },

    async putPost(post) {
      const posts = readLS(LS_POSTS, []);
      const i = posts.findIndex(p => p.id === post.id);
      if (i >= 0) posts[i] = post; else posts.unshift(post);
      writeLS(LS_POSTS, posts);
    },

    async removePost(id) {
      writeLS(LS_POSTS, readLS(LS_POSTS, []).filter(p => p.id !== id));
    },

    async putImage(id, blob) {
      await idb.put(id, blob);
      const old = this._blobUrls.get(id);
      if (old) URL.revokeObjectURL(old);
      this._blobUrls.set(id, URL.createObjectURL(blob));
    },

    async imageUrl(id) {
      if (this._blobUrls.has(id)) return this._blobUrls.get(id);
      const blob = await idb.get(id);
      if (!blob) return null;
      const url = URL.createObjectURL(blob);
      this._blobUrls.set(id, url);
      return url;
    },

    async removeImage(id) {
      await idb.del(id);
      const old = this._blobUrls.get(id);
      if (old) { URL.revokeObjectURL(old); this._blobUrls.delete(id); }
    },

    async imageBlob(id) { return idb.get(id); }
  };

  /* ---------------- 云端后端（Supabase） ----------------
   * 需要用户在「云端设置」中填写：
   *   Project URL : https://xxxxx.supabase.co
   *   anon key    : eyJhbGci...
   *   bucket      : notebook-images （需设为 public）
   * 建表 SQL 见 README.md
   * --------------------------------------------------- */
  const CloudStore = {
    mode: 'cloud',
    label: '云端 (Supabase)',
    cfg: null,

    async init() {
      this.cfg = readLS(LS_CONFIG, null);
      return !!(this.cfg && this.cfg.url && this.cfg.key);
    },

    _headers(extra) {
      const sess = readLS(LS_AUTH, null);
      const token = (sess && sess.access_token) || this.cfg.key;
      return Object.assign({
        'apikey': this.cfg.key,
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      }, extra || {});
    },

    /* ---------- Supabase Auth（管理员登录，站点公开后唯一的写入口） ---------- */
    authSession() { return readLS(LS_AUTH, null); },

    _saveAuth(sess) { writeLS(LS_AUTH, sess || null); },

    authed() {
      const s = this.authSession();
      return !!(s && (s.access_token || s.refresh_token));
    },

    authEmail() {
      const s = this.authSession();
      return (s && s.email) || '';
    },

    async signIn(email, password) {
      const res = await fetch(this.cfg.url.replace(/\/+$/, '') + '/auth/v1/token?grant_type=password', {
        method: 'POST',
        headers: { 'apikey': this.cfg.key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: String(email).trim(), password })
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(d.error_description || d.msg || d.error || ('登录失败 HTTP ' + res.status));
      }
      this._saveAuth({
        access_token: d.access_token,
        refresh_token: d.refresh_token,
        expires_at: Date.now() + (d.expires_in || 3600) * 1000,
        email: d.user && d.user.email
      });
      return d;
    },

    async refreshAuth() {
      const s = this.authSession();
      if (!s || !s.refresh_token) throw new Error('登录已过期，请重新登录');
      const res = await fetch(this.cfg.url.replace(/\/+$/, '') + '/auth/v1/token?grant_type=refresh_token', {
        method: 'POST',
        headers: { 'apikey': this.cfg.key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: s.refresh_token })
      });
      if (!res.ok) { this._saveAuth(null); throw new Error('登录已过期，请重新登录'); }
      const d = await res.json();
      const next = {
        access_token: d.access_token,
        refresh_token: d.refresh_token,
        expires_at: Date.now() + (d.expires_in || 3600) * 1000,
        email: (d.user && d.user.email) || s.email
      };
      this._saveAuth(next);
      return next;
    },

    signOut() { this._saveAuth(null); },

    async _json(path, opts, retried) {
      const res = await fetch(this.cfg.url.replace(/\/+$/, '') + path,
        Object.assign({ headers: this._headers() }, opts || {}));
      if (res.status === 401 && !retried && this.authSession() && this.authSession().refresh_token) {
        await this.refreshAuth();
        return this._json(path, opts, true);
      }
      if (!res.ok) {
        const txt = await res.text().catch(() => '');
        throw new Error('云端请求失败 ' + res.status + '：' + txt.slice(0, 300));
      }
      const txt = await res.text();
      return txt ? JSON.parse(txt) : null;
    },

    async test() {
      await this._json('/rest/v1/nb_posts?select=id&limit=1');
      return true;
    },

    /* 静态镜像：托管页面旁的 posts.json / img/ 目录（GitHub Pages 提供）。
       有些网络访问不到 Supabase，这时用它兜底，读者依然能看到文章。 */
    staticMirror: null,

    setStaticMirror(data) {
      const ok = data && Array.isArray(data.posts) && data.posts.length > 0;
      this.staticMirror = ok ? {
        posts: data.posts,
        imgBase: data.imgBase || 'img/',
        images: new Set(Array.isArray(data.images) ? data.images : []),
        dataUris: data.dataUris || null,
        site: data.site || null
      } : null;
      return !!this.staticMirror;
    },

    /* 快照里带的站点设置（名称/简介/头像），供品牌区在没有本地自定义时使用 */
    mirrorSite() { return (this.staticMirror && this.staticMirror.site) || null; },

    hasStatic() { return !!(this.staticMirror && this.staticMirror.posts.length); },

    async loadAll() {
      const posts = await this._json('/rest/v1/nb_posts?select=*&order=updatedAt.desc');
      return { posts: posts || [] };
    },

    async putPost(post) {
      await this._json('/rest/v1/nb_posts', {
        method: 'POST',
        headers: this._headers({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
        body: JSON.stringify(post)
      });
    },

    async removePost(id) {
      await this._json('/rest/v1/nb_posts?id=eq.' + id, { method: 'DELETE' });
    },

    async putImage(id, blob, retried) {
      const path = this.cfg.bucket + '/' + id;
      const res = await fetch(this.cfg.url.replace(/\/+$/, '') + '/storage/v1/object/' + path, {
        method: 'POST',
        headers: {
          'apikey': this.cfg.key,
          'Authorization': 'Bearer ' + this._headers().Authorization.slice(7),
          'Content-Type': blob.type || 'image/jpeg',
          'x-upsert': 'true'
        },
        body: blob
      });
      if (res.status === 401 && !retried && this.authSession() && this.authSession().refresh_token) {
        await this.refreshAuth();
        return this.putImage(id, blob, true);
      }
      if (!res.ok) {
        const txt = await res.text().catch(() => '');
        throw new Error('图片上传失败 ' + res.status + '：' + txt.slice(0, 300));
      }
    },

    async imageUrl(id) {
      const m = this.staticMirror;
      if (m && m.dataUris && m.dataUris[id]) return m.dataUris[id];
      if (m && m.images.has(id)) return m.imgBase + encodeURIComponent(id);
      const path = (this.cfg.bucket || 'notebook-images') + '/' + id;
      return this.cfg.url.replace(/\/+$/, '') + '/storage/v1/object/public/' + path;
    },

    async removeImage(id, retried) {
      const path = this.cfg.bucket + '/' + id;
      const res = await fetch(this.cfg.url.replace(/\/+$/, '') + '/storage/v1/object/' + path, {
        method: 'DELETE',
        headers: { 'apikey': this.cfg.key, 'Authorization': 'Bearer ' + this._headers().Authorization.slice(7) }
      });
      if (res.status === 401 && !retried && this.authSession() && this.authSession().refresh_token) {
        await this.refreshAuth();
        return this.removeImage(id, true);
      }
    },

    async imageBlob(id) {
      const res = await fetch(await this.imageUrl(id));
      if (!res.ok) return null;
      return res.blob();
    },

    /* 发布整站：把单文件 HTML 传到 public 桶，得到一个所有人可访问的网址。
       走标准 /object 接口（非 tus），用已登录身份。
       注意：必须先 DELETE 旧对象再全新上传，不能用 x-upsert 覆盖——
       upsert 只更新数据库记录，底层对象的 Content-Type 仍是首次上传时的值
       （曾导致公网打开显示 HTML 源码：实际返回 text/plain）。 */
    async publishFile(name, text, contentType, retried) {
      const path = (this.cfg.bucket || 'notebook-images') + '/' + name;
      const base = this.cfg.url.replace(/\/+$/, '');
      const auth = {
        'apikey': this.cfg.key,
        'Authorization': 'Bearer ' + this._headers().Authorization.slice(7)
      };
      await fetch(base + '/storage/v1/object/' + path, { method: 'DELETE', headers: auth }).catch(() => {});
      const res = await fetch(base + '/storage/v1/object/' + path, {
        method: 'POST',
        headers: Object.assign({}, auth, {
          'Content-Type': contentType || 'text/html; charset=utf-8',
          'cache-control': '0'
        }),
        body: text
      });
      if (res.status === 401 && !retried && this.authSession() && this.authSession().refresh_token) {
        await this.refreshAuth();
        return this.publishFile(name, text, contentType, true);
      }
      if (!res.ok) {
        const txt = await res.text().catch(() => '');
        throw new Error('发布失败 ' + res.status + '：' + txt.slice(0, 300));
      }
      return this.cfg.url.replace(/\/+$/, '') + '/storage/v1/object/public/' + path;
    },

  };

  /* ---------------- 对外统一出口 ---------------- */
  const Store = {
    mode: 'local',

    get impl() { return this.mode === 'cloud' ? CloudStore : LocalStore; },

    async init() {
      const cfg = readLS(LS_CONFIG, null);
      this.mode = (cfg && cfg.url && cfg.key && cfg.enabled) ? 'cloud' : 'local';
      return this.impl.init();
    },

    async switchTo(mode) {
      const cfg = readLS(LS_CONFIG, null) || {};
      cfg.enabled = (mode === 'cloud');
      writeLS(LS_CONFIG, cfg);
      this.mode = cfg.enabled && cfg.url && cfg.key ? 'cloud' : 'local';
      return this.impl.init();
    },

    async loadAll() { return this.impl.loadAll(); },
    setStaticMirror(d) { return CloudStore.setStaticMirror(d); },
    hasStatic() { return CloudStore.hasStatic(); },
    mirrorSite() { return CloudStore.mirrorSite(); },
    staticPosts() { const m = CloudStore.staticMirror; return m ? m.posts : []; },
    async putPost(p) { return this.impl.putPost(p); },
    async removePost(id) { return this.impl.removePost(id); },
    async putImage(id, blob) { return this.impl.putImage(id, blob); },
    async imageUrl(id) { return this.impl.imageUrl(id); },
    async removeImage(id) { return this.impl.removeImage(id); },
    async imageBlob(id) { return this.impl.imageBlob(id); },
    async publishFile(name, text, contentType) {
      if (this.mode !== 'cloud') throw new Error('请先启用云端存储');
      return CloudStore.publishFile(name, text, contentType);
    },
    test() { return CloudStore.test(); },

    /* Supabase Auth（云端模式的管理员登录） */
    signIn(email, pw) { return CloudStore.signIn(email, pw); },
    signOut() { CloudStore.signOut(); },
    authed() { return this.mode === 'cloud' ? CloudStore.authed() : false; },
    authEmail() { return CloudStore.authEmail(); },

    /* 密码哈希：云端模式改用 Supabase Auth（邮箱+密码），不再使用自管密码；
       本地模式仍存 localStorage */
    async getPassHash() {
      if (this.mode === 'cloud') return '';
      return this.getSettings().passHash || '';
    },

    async setPassHash(h) {
      if (this.mode === 'cloud') return;   // 云端模式由 Supabase Auth 管理
      const s = this.getSettings();
      s.passHash = h;
      this.saveSettings(s);
    },

    /* 默认预填本机用户的 Supabase 项目地址与 publishable key（前端公开密钥，等同旧 anon key），
       换项目直接覆盖即可 */
    getConfig() {
      return readLS(LS_CONFIG, {
        enabled: false,
        url: 'https://nlxjbeooxqovoukbdmqr.supabase.co',
        key: 'sb_publishable_Hvf84ZCZ580Ioyq6wi6vHg_WpSF32VO',
        bucket: 'notebook-images'
      });
    },
    saveConfig(cfg) { writeLS(LS_CONFIG, cfg); },

    /* 站点配置（站点名、简介、管理密码哈希）只存本地，不同步到云端 */
    getSettings() {
      return readLS(LS_SETTINGS, { siteName: '我的文字站', intro: '', passHash: '' });
    },
    saveSettings(s) { writeLS(LS_SETTINGS, s); },

    uid
  };

  global.Store = Store;
})(window);

</script>
<script>
/* =========================================================
 * app.js —— 面向读者的阅读站 + 面向作者的更新后台
 * 视图：#/(列表)  #/p/<id>(全文)  #/admin(后台)  #/edit/<id>(编辑)
 * 每次保存都会把旧版本存入历史，随时可回滚——更新内容不会弄丢旧稿。
 * ========================================================= */
(function () {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const uid = Store.uid;

  const state = {
    posts: [],
    current: null,     // 正在编辑的文章
    authed: false
  };

  /* =============== 工具 =============== */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fmtDate(ts) {
    const d = new Date(ts);
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;
  }

  function fmtFull(ts) {
    const d = new Date(ts);
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function toast(msg) {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2400);
  }

  function openDialog(title, bodyHTML, buttons) {
    $('#dialogTitle').textContent = title;
    $('#dialogBody').innerHTML = bodyHTML || '';
    const foot = $('#dialogFoot');
    foot.innerHTML = '';
    (buttons || []).forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'btn ' + (b.cls || '');
      btn.textContent = b.text;
      btn.onclick = b.onClick;
      foot.appendChild(btn);
    });
    $('#dialog').hidden = false;
  }

  function closeDialog() { $('#dialog').hidden = true; }

  /* 清理粘贴进来的危险内容 */
  function sanitize(html) {
    const d = document.createElement('div');
    d.innerHTML = html || '';
    d.querySelectorAll('script,style,iframe,object,embed,link,meta,form').forEach(n => n.remove());
    d.querySelectorAll('*').forEach(n => {
      [...n.attributes].forEach(a => {
        if (/^on/i.test(a.name)) n.removeAttribute(a.name);
        const v = (a.value || '').replace(/\s/g, '').toLowerCase();
        if ((a.name === 'src' || a.name === 'href') && v.startsWith('javascript:')) n.removeAttribute(a.name);
      });
    });
    return d.innerHTML;
  }

  function plainText(html, limit) {
    const d = document.createElement('div');
    d.innerHTML = html || '';
    const t = (d.textContent || '').replace(/\s+/g, ' ').trim();
    return limit && t.length > limit ? t.slice(0, limit) + '…' : t;
  }

  /* =============== 密码 =============== */
  function legacyHash(pw) {
    let h = 5381;
    const s = String(pw) + ':nb';
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    return 'legacy:' + h.toString(16);
  }

  async function sha256(pw) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(pw) + ':nb'));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }

  /* 密码哈希要存到云端，用 PBKDF2 而非裸 SHA-256：
     随机盐 + 15 万次迭代，被拖库后离线爆破成本高得多。
     格式：pbkdf2$<迭代次数>$<盐base64>$<派生密钥base64> */
  const PBKDF2_ITER = 150000;

  function toB64(bytes) {
    let s = '';
    for (const b of bytes) s += String.fromCharCode(b);
    return btoa(s);
  }

  function fromB64(str) {
    const bin = atob(str);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function pbkdf2(pw, salt, iter) {
    const key = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(String(pw)), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, key, 256);
    return new Uint8Array(bits);
  }

  async function makeHash(pw) {
    if (window.crypto && crypto.subtle && window.isSecureContext) {
      try {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const dk = await pbkdf2(pw, salt, PBKDF2_ITER);
        return 'pbkdf2$' + PBKDF2_ITER + '$' + toB64(salt) + '$' + toB64(dk);
      } catch (e) { /* 落到 legacy */ }
    }
    return legacyHash(pw);
  }

  async function verifyPassword(pw) {
    const h = await Store.getPassHash();
    if (!h) return null;                                 // 尚未设置
    if (h.startsWith('legacy:')) return h === legacyHash(pw);
    if (h.startsWith('pbkdf2$')) {
      try {
        const [, it, saltS, dkS] = h.split('$');
        const dk = await pbkdf2(pw, fromB64(saltS), parseInt(it, 10) || PBKDF2_ITER);
        return toB64(dk) === dkS;
      } catch (e) { return false; }
    }
    /* 旧格式：裸 sha256（历史数据兼容） */
    if (window.crypto && crypto.subtle && window.isSecureContext) {
      try { return h === await sha256(pw); } catch (e) { return false; }
    }
    return false;                                        // 存的是强哈希但当前环境不支持
  }

  /* 用旧格式登录成功后，静默升级为 PBKDF2 存回（仅本地模式） */
  async function upgradeHashIfNeeded(pw) {
    if (Store.mode === 'cloud') return;
    const h = await Store.getPassHash();
    if (!h || h.startsWith('pbkdf2$')) return;
    try { await Store.setPassHash(await makeHash(pw)); } catch (e) { /* 本地失败忽略 */ }
  }

  /* =============== 管理员登录 ===============
   * 本地模式：本机自管密码（PBKDF2 哈希）
   * 云端模式：Supabase Auth 邮箱+密码，RLS 只放行这个账号写数据 */
  function isAuthed() {
    if (state.authed) return true;
    if (Store.mode === 'cloud' && Store.authed()) { state.authed = true; return true; }
    if (sessionStorage.getItem('notebook:v1:auth') === '1') { state.authed = true; return true; }
    return false;
  }

  /* =============== GitHub 令牌登录 ===============
     有些网络访问不到 Supabase（登不上、也写不了库）。这条通道只用 GitHub：
     校验令牌归属 → 文章存本机 → 点「同步到静态站」直接写进 GitHub 仓库。 */
  const GH_OWNER = 'youxiang-wanjuwu';

  async function importSnapshotToLocal() {
    if (Store.mode !== 'local') return 0;
    const snap = window.__NB_SNAPSHOT__;
    if (!snap || !snap.posts || !snap.posts.length) return 0;
    const cur = (await Store.loadAll()).posts || [];
    const map = new Map(cur.map(p => [p.id, p]));
    let n = 0;
    for (const p of snap.posts) {
      const old = map.get(p.id);
      /* 只补新的、更新的，别覆盖本机刚写的草稿 */
      if (!old || (p.updatedAt || 0) > (old.updatedAt || 0)) { await Store.putPost(p); n++; }
    }
    return n;
  }

  /* 云端连不上时自动切到本机模式，避免每一步保存都报错 */
  async function ensureUsableMode() {
    if (Store.mode !== 'cloud') { await importSnapshotToLocal(); return; }
    try {
      await Store.test();
      return;
    } catch (e) {
      await Store.switchTo('local');
      await importSnapshotToLocal();
    }
  }

  /* 本机已保存令牌且仍然有效 → 免密登录 */
  async function trySavedGithubLogin() {
    const t = (localStorage.getItem(GH_TOKEN_KEY) || '').trim();
    if (!t) return false;
    try {
      const res = await fetch('https://api.github.com/user', {
        headers: { 'Authorization': 'Bearer ' + t, 'Accept': 'application/vnd.github+json' }
      });
      if (!res.ok) return false;
      const u = await res.json();
      if (u.login && u.login !== GH_OWNER) return false;
      state.authed = true;
      sessionStorage.setItem('notebook:v1:auth', '1');
      return true;
    } catch (e) { return false; }
  }

  async function githubLogin(onOk) {
    const input = window.prompt(
      '粘贴 GitHub 令牌（ghp_ 开头，勾选 repo 权限生成的那种）\n\n' +
      '适用于这台设备访问不到 Supabase 的情况：登录后文章保存在本机，\n' +
      '点「同步到静态站」直接写进 GitHub，读者即可看到。\n\n留空取消。');
    if (!input) return;
    const token = input.trim();
    if (!token) return;
    try {
      const res = await fetch('https://api.github.com/user', {
        headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' }
      });
      if (!res.ok) throw new Error('GitHub 不接受这个令牌（' + res.status + '）');
      const u = await res.json();
      if (u.login && u.login !== GH_OWNER) throw new Error('这个令牌属于 ' + u.login + '，不是本站所有者');
      localStorage.setItem(GH_TOKEN_KEY, token);
      state.authed = true;
      sessionStorage.setItem('notebook:v1:auth', '1');
      closeDialog();
      await ensureUsableMode();
      await load();
      toast('已登录（GitHub 令牌）');
      onOk();
    } catch (e) {
      toast('登录失败：' + (e && e.message ? e.message : e));
    }
  }

  async function askPassword(onOk) {
    if (Store.mode === 'cloud') {
      openDialog('管理员登录', `
        <p>站点公开后任何人可阅读；更新内容需要用管理员账号（Supabase Auth）登录。</p>
        <div class="field">
          <label>邮箱</label>
          <input id="admEmail" type="email" placeholder="you@example.com" autocomplete="username">
        </div>
        <div class="field">
          <label>密码</label>
          <input id="admPw" type="password" autocomplete="current-password">
        </div>
        <div class="hint" id="admErr"></div>
        <div class="tip">如果这台设备连不上 Supabase（登录一直失败），改用「GitHub 令牌登录」，
只需要能打开 GitHub，文章会直接写进站点仓库。</div>`, [
        { text: '取消', onClick: closeDialog },
        { text: 'GitHub 令牌登录', onClick: () => githubLogin(onOk) },
        {
          text: '登录', cls: 'primary', onClick: async () => {
            const email = $('#admEmail').value.trim(), pw = $('#admPw').value;
            if (!email || !pw) { toast('请填写邮箱和密码'); return; }
            try {
              await Store.signIn(email, pw);
              state.authed = true;
              sessionStorage.setItem('notebook:v1:auth', '1');
              closeDialog();
              onOk();
            } catch (e) {
              $('#admErr').innerHTML = '<span style="color:var(--danger)">' + esc(e.message) + '</span>';
            }
          }
        }
      ]);
      setTimeout(() => { const i = $('#admEmail'); if (i) i.focus(); }, 50);
      return;
    }

    const h = await Store.getPassHash();
    if (!h) {
      openDialog('设置管理密码', `
        <p>首次进入后台，请先设置一个密码。之后在别的设备上打开本站，需要用这个密码才能更新文章。</p>
        <div class="field">
          <label>密码</label>
          <input id="pwNew" type="password" placeholder="至少 4 位">
        </div>
        <div class="field">
          <label>再输入一次</label>
          <input id="pwNew2" type="password">
        </div>
        <div class="tip">提示：${Store.mode === 'cloud' ? '密码会同步到云端，各设备通用；' : '密码保存在本机浏览器；'}无法找回，请自己记牢。</div>`, [
        { text: '取消', onClick: closeDialog },
        {
          text: '设置并进入', cls: 'primary', onClick: async () => {
            const a = $('#pwNew').value, b = $('#pwNew2').value;
            if (a.length < 4) { toast('密码至少 4 位'); return; }
            if (a !== b) { toast('两次输入不一致'); return; }
            try {
              await Store.setPassHash(await makeHash(a));
            } catch (e) {
              toast(e.message);
              return;
            }
            state.authed = true;
            sessionStorage.setItem('notebook:v1:auth', '1');
            closeDialog();
            onOk();
          }
        }
      ]);
      return;
    }

    openDialog('请输入管理密码', `
      <div class="field">
        <label>密码</label>
        <input id="pwInput" type="password" placeholder="输入管理密码">
      </div>`, [
      { text: '取消', onClick: closeDialog },
      {
        text: '进入', cls: 'primary', onClick: async () => {
          const val = $('#pwInput').value;
          const ok = await verifyPassword(val);
          if (!ok) { toast('密码不对'); return; }
          await upgradeHashIfNeeded(val);
          state.authed = true;
          sessionStorage.setItem('notebook:v1:auth', '1');
          closeDialog();
          onOk();
        }
      }
    ]);
    setTimeout(() => { const i = $('#pwInput'); if (i) i.focus(); }, 50);
  }

  function requireAuth(then) {
    if (isAuthed()) { then(); return; }
    /* 这台设备存过 GitHub 令牌：直接放行，不用每次都输密码 */
    trySavedGithubLogin().then(ok => {
      if (ok) {
        ensureUsableMode().then(() => load()).then(then);
        return;
      }
      askPassword(then);
    });
  }

  /* =============== 视图切换与路由 =============== */
  function showView(id) {
    ['viewHome', 'viewPost', 'viewAdmin', 'viewEditor'].forEach(v => {
      const el = document.getElementById(v);
      if (el) el.hidden = (v !== id);
    });
    const shown = document.querySelector('.page:not([hidden])');
    if (shown) shown.scrollTop = 0;
    window.scrollTo(0, 0);
  }

  function go(hash) { location.hash = hash; }

  async function route() {
    const h = location.hash || '#/';
    if (h.startsWith('#/p/')) await showPost(h.slice(4));
    else if (h === '#/admin') { requireAuth(() => { showView('viewAdmin'); renderAdmin(); }); }
    else if (h.startsWith('#/edit/')) { requireAuth(() => openEditor(h.slice(7))); }
    else { showView('viewHome'); renderHome(); }
  }

  /* =============== 首页列表 =============== */
  /* 品牌信息合并：本机自定义优先；没自定义时用快照里带来的站点设置，
     这样在一台设备上改的名字/简介/头像，同步后其他设备也能看到 */
  function brandSettings() {
    const s = Store.getSettings();
    const out = { siteName: s.siteName || '', intro: s.intro || '', logo: s.logo || '' };
    const site = Store.mirrorSite && Store.mirrorSite();
    if (site) {
      const localDefault = !out.siteName || out.siteName === '我的文字站';
      if (localDefault) {
        if (site.siteName) out.siteName = site.siteName;
        if (!out.intro && site.intro) out.intro = site.intro;
      }
      if (!out.logo && site.logo) out.logo = site.logo;
    }
    return out;
  }

  function renderLogo(el, b) {
    if (b.logo) {
      el.textContent = '';
      const img = document.createElement('img');
      img.src = b.logo;
      img.alt = b.siteName || '';
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;';
      el.appendChild(img);
    } else {
      el.textContent = (b.siteName || '文').trim().charAt(0);
    }
  }

  function renderHome() {
    const b = brandSettings();
    $('#siteName').textContent = b.siteName || '我的文字站';
    $('#siteIntro').textContent = b.intro || '记录与分享';
    renderLogo($('#siteLogo'), b);
    document.title = b.siteName || '我的文字站';

    const list = state.posts.filter(p => p.published).sort((a, b) => b.updatedAt - a.updatedAt);
    const box = $('#postList');
    box.innerHTML = '';
    $('#homeEmpty').hidden = list.length > 0;
    $('#homeIntro').textContent = b.intro || '';

    if (state.loadError) {
      const warn = document.createElement('div');
      warn.className = 'tip';
      warn.style.margin = '0 0 16px';
      warn.style.borderColor = '#ff6b6b';
      warn.textContent = state.loadError;
      box.appendChild(warn);
    } else if (state.fromMirror) {
      const tip = document.createElement('div');
      tip.className = 'tip';
      tip.style.margin = '0 0 16px';
      tip.style.opacity = '.7';
      tip.textContent = '当前显示的是站点内置快照，联网后会自动更新为最新内容。';
      box.appendChild(tip);
    }

    list.forEach(p => {
      const a = document.createElement('a');
      a.className = 'post-card';
      a.href = '#/p/' + p.id;
      const excerpt = plainText(p.html, 140);
      const html = `
        ${p.cover ? `<img class="pc-cover" data-cover="${p.cover}" alt="">` : ''}
        <h2>${esc(p.title || '未命名')}</h2>
        ${excerpt ? `<p class="pc-excerpt">${esc(excerpt)}</p>` : ''}
        <div class="pc-meta"><span>${fmtDate(p.updatedAt)}</span></div>`;
      a.innerHTML = html;
      box.appendChild(a);
      if (p.cover) {
        const im = a.querySelector('[data-cover]');
        Store.imageUrl(p.cover).then(u => { if (u) im.src = u; });
      }
    });
  }

  /* =============== 文章全文页 =============== */
  async function showPost(id) {
    const p = state.posts.find(x => x.id === id);
    showView('viewPost');
    if (!p) {
      $('#articleTitle').textContent = '文章不存在';
      $('#articleMeta').textContent = '';
      $('#articleBody').innerHTML = '<p>这篇内容可能已被删除。 <a href="#/">返回列表</a></p>';
      $('#btnEditThis').hidden = true;
      return;
    }

    document.title = (p.title || '未命名') + ' · ' + (Store.getSettings().siteName || '我的文字站');
    $('#articleTitle').textContent = p.title || '未命名';
    $('#articleMeta').textContent =
      `更新于 ${fmtDate(p.updatedAt)}` + (p.history && p.history.length ? ` · 共 ${p.history.length + 1} 个版本` : '');

    const body = $('#articleBody');
    body.innerHTML = sanitize(p.html);
    // 图片按 id 还原真实地址
    const imgs = body.querySelectorAll('img[data-img-id]');
    for (const im of imgs) {
      const url = await Store.imageUrl(im.dataset.imgId);
      if (url) im.src = url;
      im.onclick = () => { $('#lightboxImg').src = url; $('#lightbox').hidden = false; };
    }

    $('#btnEditThis').hidden = !isAuthed();
    $('#btnEditThis').onclick = () => go('#/edit/' + p.id);
  }

  /* =============== 后台 =============== */
  function renderAdmin() {
    const s = Store.getSettings();
    $('#adminHint').innerHTML =
      `<span class="status-dot ${Store.mode === 'cloud' ? 'on' : 'off'}"></span>` +
      `存储位置：${Store.impl.label} · 共 ${state.posts.length} 篇（已发布 ${state.posts.filter(p => p.published).length} 篇）` +
      (Store.mode === 'cloud' && Store.authed()
        ? ` · 管理员：${esc(Store.authEmail())} <button class="btn ghost sm" id="btnSignOut">退出登录</button>`
        : '');

    const box = $('#adminList');
    box.innerHTML = '';
    const so = $('#btnSignOut');
    if (so) so.onclick = () => {
      Store.signOut();
      state.authed = false;
      sessionStorage.removeItem('notebook:v1:auth');

      toast('已退出登录');
    };
    const list = state.posts.slice().sort((a, b) => b.updatedAt - a.updatedAt);

      box.innerHTML = '<div class="home-empty"><p>还没有文章</p><span>点右上角「写新文章」开始。</span></div>';

    }

    list.forEach(p => {
      const item = document.createElement('div');
      item.className = 'admin-item';
      item.innerHTML = `
        <div class="ai-main">
          <div class="ai-title">${esc(p.title || '未命名')}${p.published ? '' : ' <span class="pc-draft">草稿</span>'}</div>
          <div class="ai-sub">更新 ${fmtFull(p.updatedAt)} · ${plainText(p.html, 40) || '（无正文）'}</div>
        </div>
        <div class="ai-ops"></div>`;

      const ops = item.querySelector('.ai-ops');

      const bEdit = document.createElement('button');
      bEdit.className = 'btn ghost sm';
      bEdit.textContent = '编辑';
      bEdit.onclick = () => go('#/edit/' + p.id);
      ops.appendChild(bEdit);

      const bPub = document.createElement('button');
      bPub.className = 'btn ghost sm';
      bPub.textContent = p.published ? '转草稿' : '发布';
      bPub.onclick = async () => {
        p.published = !p.published;
        p.updatedAt = Date.now();
        await Store.putPost(p);
        renderAdmin();
        toast(p.published ? '已发布' : '已转为草稿');
      };
      ops.appendChild(bPub);

      const bDel = document.createElement('button');
      bDel.className = 'btn danger sm';
      bDel.textContent = '删除';
      bDel.onclick = async () => {
        if (!confirm(`确定删除《${p.title || '未命名'}》？此操作不可恢复。`)) return;
        await deletePost(p);
        renderAdmin();
        toast('已删除');
      };
      ops.appendChild(bDel);

      box.appendChild(item);
    });
  }

  async function deletePost(p) {
    const d = document.createElement('div');
    d.innerHTML = p.html || '';
    const ids = new Set([...d.querySelectorAll('img[data-img-id]')].map(i => i.dataset.imgId));
    if (p.cover) ids.add(p.cover);
    for (const id of ids) await Store.removeImage(id);
    await Store.removePost(p.id);
    state.posts = state.posts.filter(x => x.id !== p.id);
  }

  /* =============== 编辑器 =============== */
  function openEditor(id) {
    let p = state.posts.find(x => x.id === id);
    if (!p) {
      p = {
        id: id || uid(), title: '', html: '', cover: null,
        tags: [], createdAt: Date.now(), updatedAt: Date.now(),
        published: true, history: [], __new: true
      };
      state.posts.unshift(p);
    }
    state.current = p;

    showView('viewEditor');
    $('#postTitle').value = p.title || '';
    $('#postPublished').checked = p.published !== false;
    const ed = $('#editor');
    ed.innerHTML = sanitize(p.html || '');
    ed.dataset.placeholder = '从这里开始写正文…';

    // 还原图片
    ed.querySelectorAll('img[data-img-id]').forEach(async im => {
      const url = await Store.imageUrl(im.dataset.imgId);
      if (url) im.src = url;
    });

    $('#saveState').textContent = p.createdAt
      ? `上次更新 ${fmtFull(p.updatedAt)}` : '';
    $('#btnHistory').textContent = '历史版本' + (p.history && p.history.length ? `(${p.history.length})` : '');
    ed.focus();
  }

  function exec(cmd, arg) {
    $('#editor').focus();
    try { document.execCommand(cmd, false, arg || null); } catch (e) { /* 忽略不支持的命令 */ }
  }

  /* 保存时剥掉临时 blob 地址，只留图片 id；同时做安全清理，
     避免粘贴内容里的 script / onclick 被写进存储 */
  function serializeEditor() {
    const clone = $('#editor').cloneNode(true);
    clone.querySelectorAll('img[data-img-id]').forEach(im => im.removeAttribute('src'));
    return sanitize(clone.innerHTML);
  }

  function firstImageId(html) {
    const d = document.createElement('div');
    d.innerHTML = html || '';
    const im = d.querySelector('img[data-img-id]');
    return im ? im.dataset.imgId : null;
  }

  async function savePost() {
    const p = state.current;
    if (!p) return;

    const title = $('#postTitle').value.trim();
    const html = serializeEditor();

    if (!title && !plainText(html, 1)) { toast('标题和正文都还是空的'); return; }

    const titleChanged = title !== (p.title || '');
    const bodyChanged = html !== (p.html || '');

    // 只有「已经存在过的文章」被改动时才留档；新建文章的首次保存不算一次修改
    if (!p.__new && (titleChanged || bodyChanged)) {
      p.history = p.history || [];
      p.history.unshift({ title: p.title || '', html: p.html || '', at: p.updatedAt || p.createdAt });
      p.history = p.history.slice(0, 30);
    }

    p.title = title || '未命名';
    p.html = html;
    p.published = $('#postPublished').checked;
    p.cover = firstImageId(html);
    p.updatedAt = Date.now();

    delete p.__new;                       // 必须在落库前清掉，否则重载后会被误判为新建
    await Store.putPost(p);
    if (!state.posts.includes(p)) state.posts.unshift(p);

    $('#saveState').textContent = `已保存 · ${fmtFull(p.updatedAt)}`;
    $('#btnHistory').textContent = '历史版本' + (p.history && p.history.length ? `(${p.history.length})` : '');
    toast(bodyChanged || titleChanged ? '已保存，旧版本已留档' : '已保存');
  }

  function showHistory() {
    const p = state.current;
    if (!p) return;
    if (!p.history || !p.history.length) {
      openDialog('历史版本', '<p>这篇文章还没有修改过，当前就是最初版本。</p>',
        [{ text: '知道了', cls: 'primary', onClick: closeDialog }]);
      return;
    }

    const html = p.history.map((h, i) => `
      <div class="hist-item">
        <div class="hist-head">
          <span>${fmtFull(h.at)}</span>
          ${i === 0 ? '<span class="pc-draft" style="color:var(--accent);border-color:var(--accent)">上一版</span>' : ''}
          <button class="btn ghost sm" data-restore="${i}">恢复到这版</button>
        </div>
        <div class="hist-text">${esc(plainText(h.html, 200)) || '<i>（无正文）</i>'}</div>
      </div>`).join('');

    openDialog('历史版本', html, [{ text: '关闭', onClick: closeDialog }]);

    $('#dialogBody').querySelectorAll('[data-restore]').forEach(btn => {
      btn.onclick = async () => {
        const h = p.history[Number(btn.dataset.restore)];
        if (!confirm('把正文恢复到 ' + fmtFull(h.at) + ' 这一版？当前内容会先留档。')) return;
        p.history.unshift({ title: p.title || '', html: p.html || '', at: p.updatedAt || Date.now() });
        p.title = h.title || p.title;
        p.html = h.html || '';
        p.updatedAt = Date.now();
        await Store.putPost(p);
        closeDialog();
        openEditor(p.id);
        toast('已恢复旧版本');
      };
    });
  }

  /* =============== 图片 =============== */
  async function compressImage(file, maxSide = 1800, quality = 0.86) {
    try {
      const bmp = await (typeof createImageBitmap === 'function'
        ? createImageBitmap(file).catch(() => viaImg(file))
        : viaImg(file));
      const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
      const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
      if (bmp.close) bmp.close();
      const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', quality));
      return blob || file;
    } catch (err) {
      console.warn('[img] 压缩失败，使用原图', err);
      return file;
    }
  }

  function viaImg(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const im = new Image();
      im.onload = () => { URL.revokeObjectURL(url); resolve(im); };
      im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode fail')); };
      im.src = url;
    });
  }

  async function insertImages(files) {
    for (const f of files) {
      if (!f || !f.type || !f.type.startsWith('image/')) continue;
      const blob = await compressImage(f);
      const id = uid();
      await Store.putImage(id, blob);
      const url = await Store.imageUrl(id);
      exec('insertHTML',
        `<img data-img-id="${id}" src="${url}" alt="${esc(f.name)}"><br>`);
    }
    toast('图片已插入');
  }

  /* =============== 备份 =============== */
  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }

  function base64ToBlob(b64) {
    const [meta, data] = String(b64).split(',');
    const mime = (meta.match(/:(.*?);/) || [, 'image/jpeg'])[1];
    const bin = atob(data);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }

  async function exportBackup() {
    toast('正在打包…');
    const images = {};
    const ids = new Set();
    state.posts.forEach(p => {
      const d = document.createElement('div');
      d.innerHTML = p.html || '';
      [...d.querySelectorAll('img[data-img-id]')].forEach(i => ids.add(i.dataset.imgId));
      if (p.cover) ids.add(p.cover);
    });

    let failed = 0;
    for (const id of ids) {
      try {
        const blob = await Store.imageBlob(id);
        if (blob) images[id] = await blobToBase64(blob); else failed++;
      } catch (e) { failed++; }
    }

    const data = {
      format: 'notebook-backup', version: 2,
      exportedAt: new Date().toISOString(),
      posts: state.posts, images
    };
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `备份-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    toast(`备份完成（约 ${(blob.size / 1048576).toFixed(2)} MB）` + (failed ? `，${failed} 张图片失败` : ''));
  }

  async function importBackup(file) {
    try {

      if (data.format !== 'notebook-backup') throw new Error('不是有效的备份文件');
      if (!confirm(`备份含 ${data.posts.length} 篇文章。导入会覆盖当前内容，确定继续？`)) return;
      if (Store.mode === 'local') {

  /* 把图片压成正方形小头像 data URI（canvas 居中裁剪） */
  function fileToLogoDataUri(file, size) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        try {
          const c = document.createElement('canvas');
          c.width = c.height = size;
          const ctx = c.getContext('2d');
          const side = Math.min(img.width, img.height);
          ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/jpeg', 0.85));
        } catch (e) { URL.revokeObjectURL(url); reject(e); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
      img.src = url;
    });
  }

  /* 从 Supabase 直连串推导 HTTP 接口地址：
     postgresql://postgres:pw@db.<ref>.supabase.co:5432/postgres -> https://<ref>.supabase.co */
  function urlFromConnStr(s) {
    const m = /^postgres(?:ql)?:\/\/[^@]*@([^:/]+)/i.exec((s || '').trim());
    if (!m) return '';
    const ref = /^(?:db\.)?([a-z0-9]+)\.supabase\.(?:co|net|in|com)$/i.exec(m[1]);
    return ref ? ('https://' + ref[1] + '.supabase.co') : '';
  }

  /* =============== 载入 =============== */
  /* 静态快照：托管页面同目录下的 posts.json（由 GitHub Actions 定时从云端同步）。
     先读它，读者在任何网络下都能立刻看到文章；随后再拉云端拿最新版本。 */
  async function loadStaticMirror() {
    try {
      /* 打包时内联进页面的快照优先：CDN 边缘节点同步滞后时，posts.json 可能还是 404 */
      let data = window.__NB_SNAPSHOT__ || null;
      if (!data) {
        const res = await fetch('posts.json?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) return false;
        data = await res.json();
      }
      return Store.setStaticMirror(data);
    } catch (e) { return false; }
  }

  async function load() {
    state.fromMirror = false;
    state.loadError = '';
    state.posts = [];

    /* 1) 静态快照（不依赖 Supabase） */
    if (await loadStaticMirror()) {
      state.posts = Store.staticPosts();
      state.fromMirror = true;
    }

    /* 2) 云端最新（能连上就以云端为准） */
    try {
      const data = await Store.loadAll();
      if (data.posts && data.posts.length) {
        state.posts = data.posts;
        state.fromMirror = false;
      } else if (!state.posts.length) {
        state.posts = [];
      }
    } catch (e) {
      console.error(e);
      if (state.posts.length) {
        state.loadError = '';   // 已有静态快照可看，不打扰读者
      } else {
        state.loadError = '读取云端失败：' + (e && e.message ? e.message : e) +
          '。文章本身没丢，通常是这台设备的网络访问不到 Supabase（换网络试试，或进后台看「云端存储」状态）。';
      }
    }
  }

  async function publishSiteLegacy() {
    if (Store.mode !== 'cloud') {

      return;
    }
    const btn = $('#btnPublishSite');
    const oldText = btn.textContent;
    btn.disabled = true; btn.textContent = '发布中…';
    try {
      let html = null;
      try {
        const r = await fetch('index.html', { cache: 'no-store' });
        if (r.ok) html = await r.text();
      } catch (e) { html = null; }

      if (html) {
        const [css, stjs, apjs] = await Promise.all([
          fetch('assets/styles.css', { cache: 'no-store' }).then(r => r.text()),
          fetch('assets/storage.js', { cache: 'no-store' }).then(r => r.text()),
          fetch('assets/app.js', { cache: 'no-store' }).then(r => r.text())
        ]);
        if (/<\/script/i.test(stjs + apjs)) throw new Error('脚本内容含脚本结束标签，无法安全内联');
        /* 必须用函数式替换：源码里含 $' $& 等特殊序列，字符串替换会被解释成替换模式 */
        /* 注意：脚本正文里不能出现 "<script" 字面量，否则 HTML 解析器会进入
           double-escaped 状态，后面的结束标签就无法结束本段脚本，整页脚本会崩。
           所以这里一律用字符串拼接拼出标签。 */
        const SO = '<' + 'script>';
        const SC = '<' + '/script>';
        html = html.replace(/<link[^>]+href=["']assets\/styles\.css["'][^>]*>/, () => '<style>\n' + css + '\n</style>');
        html = html.replace(/<script[^>]+src=["']assets\/storage\.js["']\s*><\/script>/, () => SO + '\n' + stjs + '\n' + SC);
        html = html.replace(/<script[^>]+src=["']assets\/app\.js["']\s*><\/script>/, () => SO + '\n' + apjs + '\n' + SC);
      } else {
        /* 已经跑在单文件版上：直接拿当前文档，效果等价 */
        html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      }
      /* 只查标签引用：内联进来的 JS 代码里本身也有 assets/ 字样，不能用 includes 全文本匹配 */
      if (/<link[^>]+assets\/styles\.css/.test(html) || /<script[^>]+src=["'][^"']*assets\//.test(html)) {
        throw new Error('资源内联失败，页面仍引用外部文件');
      }

      /* 关键：发布的页面必须默认连云端，否则读者打开是空的（本地模式没数据） */
      const cfg = Store.getConfig();
      const inject =
        '<' + 'script>(function(){try{var k="notebook:v1:config";' +
        'var c=JSON.parse(localStorage.getItem(k)||"{}");' +
        'if(!c.enabled||!c.url||!c.key){localStorage.setItem(k,JSON.stringify({' +
        'enabled:true,url:' + JSON.stringify(cfg.url || '') +
        ',key:' + JSON.stringify(cfg.key || '') +
        ',bucket:' + JSON.stringify(cfg.bucket || 'notebook-images') +
        '}));}}catch(e){}})();<' + '/script>\n';
      html = html.includes('</head>')
        ? html.replace('</head>', inject + '</head>')
        : inject + html;

      const url = await Store.publishFile('index.html', html, 'text/html; charset=utf-8');
      openDialog('发布成功', `
        <p>你的站点已经有公网地址了，把这个发给读者：</p>
        <div class="field">
          <input id="pubUrl" value="${esc(url)}" readonly onclick="this.select()">
        </div>
        <div class="tip">文章内容不需要重新发布——文章存在数据库里，保存后读者刷新即可看到。
只有当我改了站点功能（比如加了新按钮），你才需要再点一次「发布到公网」覆盖更新。</div>`, [
        {

            try { await navigator.clipboard.writeText(url); toast('已复制'); }
            catch (e) { $('#pubUrl').select(); toast('请按 Ctrl+C 复制'); }
          }
        },
        { text: '打开看看', onClick: () => window.open(url, '_blank') },
        { text: '关闭', cls: 'primary', onClick: closeDialog }
      ]);
    } catch (e) {
      openDialog('发布失败', `
        <p style="color:var(--danger)">${esc(e.message)}</p>
        <div class="tip">常见原因：① 登录已过期，退出重新登录一次；② 图片桶策略未放行你的账号，需重新执行 README 里的图片策略 SQL 并把邮箱换成你登录用的邮箱。</div>`, [
        { text: '知道了', cls: 'primary', onClick: closeDialog }
      ]);

  /* =============== 同步到静态站 =============== */
  /* 把已发布文章（含图片）写成 posts.json 提交到 GitHub 仓库。
     目的：部分网络访问不到 Supabase，读者打开页面时会回退读这份快照，
     照样能看到文章。写的是普通文件，GitHub token 只需 repo 权限。 */
  const GH_REPO = 'youxiang-wanjuwu/youxiang-wanjuwu.github.io';
  const GH_TOKEN_KEY = 'notebook:v1:ghtoken';

  function utf8ToB64(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  /* 用 GitHub Contents API 写/覆盖仓库里的一个文件 */
  async function ghPut(token, repoPath, text, message) {
    const api = 'https://api.github.com/repos/' + GH_REPO + '/contents/' + repoPath;
    const headers = {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    };
    let sha = null;
    const cur = await fetch(api, { headers });
    if (cur.ok) { const j = await cur.json(); sha = j.sha || null; }
    const body = { message: message, content: utf8ToB64(text), branch: 'main' };
    if (sha) body.sha = sha;
    const res = await fetch(api, { method: 'PUT', headers, body: JSON.stringify(body) });
    if (res.status === 401 || res.status === 403) {
      const err = new Error('GitHub 拒绝了这个 token（需要 repo 权限，或已过期）。请重新生成一个再试。');
      err.badToken = true;
      throw err;
    }
    if (!res.ok) throw new Error('GitHub 返回 ' + res.status + '：' + (await res.text()).slice(0, 200));
    return true;
  }

  function blobToDataUri(blob) {
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = rej;
      fr.readAsDataURL(blob);
    });
  }

  /* 读取 GitHub 上已有的快照（base64） */
  async function ghGetSnapshot(token) {
    try {
      const api = 'https://api.github.com/repos/' + GH_REPO + '/contents/posts.json';
      const r = await fetch(api, {
        headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' }
      });
      if (!r.ok) return null;
      const j = await r.json();
      const b64 = (j.content || '').replace(/\s/g, '');
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return JSON.parse(new TextDecoder().decode(bytes));
    } catch (e) { return null; }
  }

  async function syncStaticSnapshot() {
    let token = (localStorage.getItem(GH_TOKEN_KEY) || '').trim();
    if (!token) {
      const input = window.prompt(
        '输入 GitHub token（只保存在这台设备的浏览器里，之后不再询问）\n\n' +
        '需要：github.com → Settings → Developer settings → Personal access tokens → Tokens (classic) → 勾选 repo\n\n' +
        '留空则取消。');
      if (!input) return;
      token = input.trim();
      if (!token) return;
      localStorage.setItem(GH_TOKEN_KEY, token);
    }

    const btn = $('#btnSyncStatic');
    const oldText = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = '同步中…'; }
    try {
      /* 本机文章（云端连不上时退回页面自带的快照） */
      let mine = [];
      try { mine = (await Store.loadAll()).posts || []; }
      catch (e) { mine = state.posts || []; }
      mine = mine.filter(p => p.published);

      /* 先取 GitHub 上已有的快照，再合并：避免覆盖别的设备发过的文章 */
      const remote = await ghGetSnapshot(token);
      const merged = new Map();
      ((remote && remote.posts) || []).forEach(p => merged.set(p.id, p));
      mine.forEach(p => {
        const old = merged.get(p.id);
        if (!old || (p.updatedAt || 0) >= (old.updatedAt || 0)) merged.set(p.id, p);
      });
      const posts = [...merged.values()].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

      /* 图片转 data URI 写进去，避免读者设备加载不了云端图片；远端已有的不重复取 */
      const ids = new Set();
      posts.forEach(p => {
        if (p.cover) ids.add(p.cover);
        (p.html || '').replace(/data-img-id="([^"]+)"/g, (_, id) => { ids.add(id); return _; });
      });
      const dataUris = Object.assign({}, (remote && remote.dataUris) || {});
      for (const id of ids) {
        if (dataUris[id]) continue;
        try {
          const blob = await Store.imageBlob(id);
          if (blob) dataUris[id] = await blobToDataUri(blob);
        } catch (e) { /* 单个图片失败不影响整体 */ }
      }

      /* 合并结果写回本机，保证这台设备上的列表也是最新的 */
      if (Store.mode === 'local') {
        for (const p of posts) await Store.putPost(p);
      }

      /* 站点设置（名称/简介/头像）也进快照：本机自定义优先，否则保留远端的 */
      const st = Store.getSettings();
      const localCustom = (st.siteName && st.siteName !== '我的文字站') || st.intro || st.logo;
      const site = localCustom
        ? { siteName: st.siteName || '', intro: st.intro || '', logo: st.logo || '' }
        : ((remote && remote.site) || undefined);

      const snapshot = {
        generatedAt: new Date().toISOString(),
        imgBase: 'img/',
        images: [],
        dataUris,
        site,
        posts
      };

      const msg = '同步文章快照 ' + new Date().toISOString();
      await ghPut(token, 'posts.json', JSON.stringify(snapshot), msg);

      /* 同时把快照内联进 index.html：读者只加载一个文件就有内容，
         不受 posts.json 的 CDN 同步延迟影响 */
      let inlined = false;
      try {
        const pageRes = await fetch('index.html', { cache: 'no-store' });
        if (pageRes.ok) {
          let page = await pageRes.text();
          /* 同样不能写 "<script" 字面量（会破坏内联脚本的解析），用拼接 */
          const OPEN = '<' + 'script id="nb-snapshot">';
          const CLOSE = '<' + '/script>';
          const block = OPEN + 'window.__NB_SNAPSHOT__=' +
            JSON.stringify(snapshot).replace(/<\//g, '<\\/') + ';' + CLOSE + '\n';
          const re = new RegExp('<s' + 'cript id="nb-snapshot">[\\s\\S]*?' + CLOSE, 'i');
          page = re.test(page) ? page.replace(re, () => block) : page.replace('</head>', block + '</head>');
          await ghPut(token, 'index.html', page, msg);
          inlined = true;
        }
      } catch (e) { /* index.html 更新失败不阻断，posts.json 已生效 */ }

      const kb = Math.round(JSON.stringify(snapshot).length / 1024);
      openDialog('已同步到静态站', `
        <p>已把 <b>${posts.length}</b> 篇已发布文章（含 ${Object.keys(dataUris).length} 张图片，共 ${kb} KB）写入公网快照${inlined ? '，并内联进页面本身' : ''}。</p>
        <div class="tip">约 1 分钟后生效。之后读者即使访问不到云端数据库，也能看到这些文章。
以后每次发新文章，再点一次这个按钮即可。</div>`, [
        { text: '打开公网看看', onClick: () => window.open('https://youxiang-wanjuwu.github.io/', '_blank') },
        { text: '好', cls: 'primary', onClick: closeDialog }
      ]);
    } catch (e) {
      if (e && e.badToken) localStorage.removeItem(GH_TOKEN_KEY);
      toast('同步失败：' + (e && e.message ? e.message : e));
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = oldText; }
    }
  }

  function bind() {
    $('#btnManage').onclick = () => requireAuth(() => go('#/admin'));
    $('#btnNewPost').onclick = () => go('#/edit/' + uid());
    $('#btnBackAdmin').onclick = () => go('#/admin');
    $('#btnLogout').onclick = () => {
      state.authed = false;
      sessionStorage.removeItem('notebook:v1:auth');
      go('#/');
      toast('已退出');
    };

    $('#btnSiteCfg').onclick = siteDialog;
    $('#btnPublishSite').onclick = publishSite;
    if ($('#btnSyncStatic')) $('#btnSyncStatic').onclick = syncStaticSnapshot;
    $('#btnCloudCfg').onclick = cloudDialog;
    $('#btnBackup').onclick = exportBackup;
    $('#btnRestore').onclick = () => $('#restoreInput').click();
    $('#restoreInput').onchange = (e) => {
      if (e.target.files[0]) importBackup(e.target.files[0]);
      e.target.value = '';
    };

    // 编辑器
    $('#btnSave').onclick = savePost;
    $('#btnSaveBottom').onclick = savePost;
    $('#btnHistory').onclick = showHistory;
    $('#postTitle').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#editor').focus(); } };

    $('#toolbar').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.cmd) exec(b.dataset.cmd, b.dataset.arg);
      else if (b.dataset.block) {
        const v = b.dataset.block;
        exec('formatBlock', v === 'p' ? '<p>' : '<' + v + '>');
      }
    });

    $('#btnLink').onclick = () => {
      const url = prompt('输入链接地址（记得带 https://）');
      if (!url) return;
      exec('createLink', url);
    };

    $('#btnImage').onclick = () => $('#fileInput').click();
    $('#fileInput').onchange = (e) => { insertImages(e.target.files); e.target.value = ''; };

    const ed = $('#editor');
    ed.addEventListener('paste', (e) => {
      const items = (e.clipboardData && e.clipboardData.items) || [];
      const files = [];
      for (const it of items) if (it.type && it.type.startsWith('image/')) files.push(it.getAsFile());
      if (files.length) { e.preventDefault(); insertImages(files); }
    });

    const area = $('.editor-area');
    ['dragenter', 'dragover'].forEach(t => area.addEventListener(t, (e) => {
      e.preventDefault(); area.classList.add('dragover');
    }));
    ['dragleave', 'drop'].forEach(t => area.addEventListener(t, () => area.classList.remove('dragover')));
    area.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer && e.dataTransfer.files.length) insertImages(e.dataTransfer.files);
    });

    ed.addEventListener('keydown', (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;
      if (e.key === 's') { e.preventDefault(); savePost(); }
      else if (e.key === 'b') { e.preventDefault(); exec('bold'); }
      else if (e.key === 'i') { e.preventDefault(); exec('italic'); }
    });

    // 主题
    $('#btnTheme').onclick = () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      localStorage.setItem('notebook:v1:theme', next);
    };

    // 弹窗关闭
    document.querySelectorAll('[data-close]').forEach(el => {
      el.onclick = () => { closeDialog(); $('#lightbox').hidden = true; };
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeDialog(); $('#lightbox').hidden = true; }
    });

    window.addEventListener('hashchange', route);
  }

  /* =============== 启动 =============== */
  (async function boot() {
    const theme = localStorage.getItem('notebook:v1:theme');
    if (theme) document.documentElement.dataset.theme = theme;

    bind();
    await Store.init();
    await load();
    await route();
  })();
})();

</script>
</body>
</html>
