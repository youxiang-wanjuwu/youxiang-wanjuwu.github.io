<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的文字站</title>
<style>
:root {
  --bg: #0f1216;
  --bg-soft: #151a21;
  --panel: #1a2029;
  --panel-2: #212935;
  --line: #2b3441;
  --text: #e6ebf2;
  --text-dim: #9aa8bd;
  --text-mute: #6b7a8f;
  --accent: #4f8cff;
  --accent-soft: rgba(79, 140, 255, .14);
  --danger: #ef5b5b;
  --ok: #35c07f;
  --radius: 12px;
  --shadow: 0 8px 28px rgba(0, 0, 0, .38);
  --read-width: 720px;
}

[data-theme="light"] {
  --bg: #f7f8fb;
  --bg-soft: #eef1f6;
  --panel: #ffffff;
  --panel-2: #f5f7fb;
  --line: #e2e7f0;
  --text: #1b2330;
  --text-dim: #556174;
  --text-mute: #8b96a8;
  --accent: #2f6ff2;
  --accent-soft: rgba(47, 111, 242, .1);
  --shadow: 0 8px 26px rgba(20, 35, 60, .09);
}

* { box-sizing: border-box; }

/* hidden 必须绝对生效：否则 .modal 的 display:grid 会压过 UA 的 display:none，
   弹窗和遮罩会常驻页面顶层，挡住一切点击 */
[hidden] { display: none !important; }

html, body { height: 100%; margin: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  display: flex;
  flex-direction: column;
}

/* ---------------- 顶栏 ---------------- */
.topbar {
  flex: 0 0 auto;
  height: 58px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 22px;
  background: var(--bg-soft);
  border-bottom: 1px solid var(--line);
}

.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }

.logo {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--accent), #7aa8ff);
  color: #fff; font-weight: 700; font-size: 15px;
}

.brand-text { display: flex; flex-direction: column; line-height: 1.25; }
.brand-text strong { font-size: 15px; }
.brand-text small { color: var(--text-mute); font-size: 11.5px; }

.topbar-actions { margin-left: auto; display: flex; gap: 8px; }

/* ---------------- 按钮 ---------------- */
.btn {
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  padding: 8px 14px;
  border-radius: 9px;
  font-size: 13px;
  cursor: pointer;
  transition: .16s;
  white-space: nowrap;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); color: #fff; }
.btn.danger { border-color: transparent; background: transparent; color: var(--danger); }
.btn.danger:hover { background: rgba(239, 91, 91, .12); color: var(--danger); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 11px; font-size: 12.5px; }
.btn.icon { padding: 8px 11px; }

.icon-btn { background: none; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; padding: 4px 8px; }
.icon-btn:hover { color: var(--text); }

/* ---------------- 页面容器 ---------------- */
.page {
  flex: 1;
  overflow-y: auto;
  padding: 34px 22px 90px;
}

/* ---------------- 首页列表 ---------------- */
.home-head {
  max-width: 760px;
  margin: 0 auto 30px;
}
.home-head h1 { font-size: 27px; margin: 0 0 6px; letter-spacing: -.3px; }
.home-head p { margin: 0; color: var(--text-mute); font-size: 14px; }

.post-list { max-width: 760px; margin: 0 auto; }

.post-card {
  display: block;
  text-decoration: none;
  color: inherit;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 14px;
  transition: .18s;
}
.post-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow); }

.post-card h2 { margin: 0 0 7px; font-size: 19.5px; letter-spacing: -.2px; }
.post-card .pc-excerpt {
  color: var(--text-dim);
  font-size: 14.5px;
  line-height: 1.75;
  margin: 0 0 12px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.post-card .pc-meta { font-size: 12.5px; color: var(--text-mute); display: flex; gap: 12px; }
.post-card .pc-cover {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 9px;
  margin-bottom: 14px;
}
.post-card .pc-draft {
  color: var(--danger);
  border: 1px solid currentColor;
  border-radius: 5px;
  padding: 0 6px;
  font-size: 11px;
}

.home-empty { text-align: center; padding: 70px 20px; color: var(--text-mute); }
.home-empty p { font-size: 16px; margin: 0 0 6px; color: var(--text-dim); }

/* ---------------- 文章正文（阅读体验核心） ---------------- */
.article { max-width: var(--read-width); margin: 0 auto; }

.back-link {
  display: inline-block;
  color: var(--text-mute);
  text-decoration: none;
  font-size: 13.5px;
  margin-bottom: 18px;
}
.back-link:hover { color: var(--accent); }

.article-title {
  font-size: 32px;
  line-height: 1.35;
  margin: 0 0 12px;
  letter-spacing: -.6px;
  font-weight: 700;
}

.article-meta {
  font-size: 13px;
  color: var(--text-mute);
  padding-bottom: 22px;
  margin-bottom: 30px;
  border-bottom: 1px solid var(--line);
}

.article-body {
  font-size: 17px;
  line-height: 1.9;
  color: var(--text);
  word-break: break-word;
}
.article-body > *:first-child { margin-top: 0; }
.article-body p { margin: 0 0 1.15em; }
.article-body h2 {
  font-size: 23px; line-height: 1.45;
  margin: 2em 0 .8em;
  letter-spacing: -.3px;
}
.article-body h3 { font-size: 19px; margin: 1.7em 0 .7em; }
.article-body h4 { font-size: 16.5px; margin: 1.5em 0 .6em; }
.article-body a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
.article-body a:hover { border-bottom-color: var(--accent); }
.article-body strong { font-weight: 700; }

.article-body img {
  max-width: 100%;
  height: auto;
  border-radius: 10px;
  display: block;
  margin: 1.6em auto;
  cursor: zoom-in;
  background: var(--panel-2);
}

.article-body blockquote {
  margin: 1.5em 0;
  padding: 2px 0 2px 16px;
  border-left: 3px solid var(--accent);
  color: var(--text-dim);
  font-size: 16px;
}
.article-body blockquote p:last-child { margin-bottom: 0; }

.article-body ul, .article-body ol { margin: 0 0 1.15em; padding-left: 1.5em; }
.article-body li { margin-bottom: .45em; }
.article-body li > ul, .article-body li > ol { margin: .45em 0 0; }

.article-body code {
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  font-size: .88em;
  background: var(--panel-2);
  padding: 2px 6px;
  border-radius: 5px;
}
.article-body pre {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 14px 16px;
  overflow-x: auto;
  margin: 1.5em 0;
}
.article-body pre code { background: none; padding: 0; font-size: 13.5px; }

.article-body hr { border: none; border-top: 1px solid var(--line); margin: 2.4em 0; }

.article-foot {
  margin-top: 46px;
  padding-top: 22px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 10px;
  align-items: center;
}

/* ---------------- 后台 ---------------- */
.admin-head {
  max-width: 860px; margin: 0 auto 18px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.admin-head h1 { font-size: 24px; margin: 0; }
.admin-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

.admin-hint {
  max-width: 860px; margin: 0 auto 16px;
  font-size: 12.5px; color: var(--text-mute);
  display: flex; align-items: center; gap: 6px;
}
.admin-hint .status-dot.on { background: var(--ok); }
.admin-hint .status-dot.off { background: var(--text-mute); }

.admin-list { max-width: 860px; margin: 0 auto; }
.admin-item {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 15px 18px;
  margin-bottom: 11px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.admin-item .ai-main { flex: 1; min-width: 0; }
.admin-item .ai-title { font-size: 15.5px; font-weight: 600; margin-bottom: 3px; }
.admin-item .ai-sub { font-size: 12.5px; color: var(--text-mute); }
.admin-item .ai-ops { display: flex; gap: 7px; }

/* 分类与批量 */
.admin-item .ai-check {
  display: flex; align-items: center; gap: 4px;
  flex-shrink: 0;
}
.admin-item .ai-check input[type="checkbox"] {
  width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent);
}
.admin-item .ai-cat {
  display: inline-block;
  font-size: 11.5px;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid var(--accent-soft);
  border-radius: 999px;
  padding: 1px 9px;
  margin-right: 8px;
  vertical-align: 1px;
}
.admin-item .ai-cat-edit {
  border: none; background: transparent;
  color: var(--text-mute); cursor: pointer; font-size: 12px;
  padding: 0 4px;
}
.admin-item .ai-cat-edit:hover { color: var(--accent); }

.cat-toolbar {
  max-width: 860px; margin: 0 auto 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.cat-filter-row {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
}
.cat-filter-row .cf-label { font-size: 12.5px; color: var(--text-mute); margin-right: 4px; }
.cat-chip {
  font-size: 12.5px;
  padding: 4px 11px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text-dim);
  cursor: pointer;
  transition: all .15s;
}
.cat-chip:hover { color: var(--accent); border-color: var(--accent); }
.cat-chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.cat-chip .cf-num {
  margin-left: 5px;
  opacity: .7;
  font-size: 11px;
}

.bulk-toolbar {
  display: flex; align-items: center; gap: 10px;
  background: var(--accent);
  color: #fff;
  border-radius: var(--radius);
  padding: 10px 16px;
  font-size: 13px;
}
.bulk-toolbar .btn { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.3); color: #fff; }
.bulk-toolbar .btn:hover { background: rgba(255,255,255,.32); color: #fff; border-color: rgba(255,255,255,.5); }
.bulk-toolbar b { font-size: 14.5px; }

/* 编辑器分类输入 */
.editor-category {
  width: 160px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  border-radius: 9px;
  padding: 9px 12px;
  font-size: 13.5px;
  outline: none;
  flex-shrink: 0;
}
.editor-category:focus { border-color: var(--accent); }
@media (max-width: 640px) {
  .editor-category { width: 120px; font-size: 13px; }
  .admin-item { flex-wrap: wrap; }
  .admin-item .ai-ops { width: 100%; }
}

/* 分类管理弹窗 */
.cat-mgr-list { max-height: 320px; overflow-y: auto; border: 1px solid var(--line); border-radius: 9px; padding: 6px; }
.cat-mgr-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 7px;
  font-size: 13.5px;
}
.cat-mgr-item:hover { background: var(--panel-2); }
.cat-mgr-item .cm-name { flex: 1; min-width: 0; }
.cat-mgr-item .cm-count { font-size: 11.5px; color: var(--text-mute); }
.cat-mgr-item .cm-del {
  border: none; background: transparent;
  color: var(--danger); cursor: pointer; font-size: 14px;
  padding: 2px 6px;
}
.cat-mgr-item .cm-del:hover { background: rgba(239, 91, 91, .12); border-radius: 5px; }

/* ---------------- 编辑器 ---------------- */
.editor-bar {
  max-width: 820px; margin: 0 auto 14px;
  display: flex; align-items: center; gap: 12px;
}
.editor-title {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  border-radius: 9px;
  padding: 9px 13px;
  font-size: 17px;
  font-weight: 600;
  outline: none;
}
.editor-title:focus { border-color: var(--accent); }
.editor-bar-right { display: flex; align-items: center; gap: 12px; }

.switch { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-dim); cursor: pointer; }

.toolbar {
  max-width: 820px; margin: 0 auto 10px;
  display: flex; flex-wrap: wrap; gap: 4px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 7px 9px;
}
.toolbar button {
  border: none;
  background: transparent;
  color: var(--text-dim);
  padding: 6px 10px;
  border-radius: 7px;
  font-size: 13px;
  cursor: pointer;
}
.toolbar button:hover { background: var(--panel-2); color: var(--text); }
.tb-sep { width: 1px; background: var(--line); margin: 4px 5px; }

.editor-area {
  max-width: 820px; margin: 0 auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.editor-area.dragover { border-color: var(--accent); background: var(--accent-soft); }

#editor {
  min-height: 420px;
  padding: 22px 26px;
  outline: none;
  font-size: 16.5px;
  line-height: 1.85;
  color: var(--text);
}
#editor:empty::before {
  content: attr(data-placeholder);
  color: var(--text-mute);
}
#editor p { margin: 0 0 1em; }
#editor h2 { font-size: 22px; margin: 1.6em 0 .7em; }
#editor h3 { font-size: 18px; margin: 1.4em 0 .6em; }
#editor img { max-width: 100%; border-radius: 9px; display: block; margin: 1.2em auto; }
#editor blockquote {
  margin: 1.2em 0; padding-left: 15px;
  border-left: 3px solid var(--accent); color: var(--text-dim);
}
#editor ul, #editor ol { padding-left: 1.5em; }

.editor-foot {
  max-width: 820px; margin: 14px auto 0;
  display: flex; align-items: center; gap: 14px;
}
.editor-foot .hint { font-size: 12.5px; color: var(--text-mute); }
.editor-foot .btn { margin-left: auto; }

/* ---------------- 弹窗 ---------------- */
.modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; }
.modal-mask { position: absolute; inset: 0; background: rgba(0, 0, 0, .6); }

.dialog-box {
  position: relative;
  width: min(560px, 92vw);
  max-height: 84vh;
  display: flex; flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
}
.dialog-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
}
.dialog-head h3 { margin: 0; font-size: 15px; }
.dialog-body { padding: 16px; overflow-y: auto; font-size: 13.5px; }
.dialog-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }

.field { margin-bottom: 13px; }
.field label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 5px; }
.field input, .field textarea {
  width: 100%;
  padding: 9px 11px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  font: inherit; font-size: 13.5px;
  outline: none;
  resize: vertical;
}
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.field .tip { font-size: 11.5px; color: var(--text-mute); margin-top: 5px; }

.hist-item {
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 11px 13px;
  margin-bottom: 9px;
  background: var(--panel-2);
}
.hist-head { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-mute); margin-bottom: 6px; }
.hist-head button { margin-left: auto; }
.hist-text {
  font-size: 13px; color: var(--text-dim);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}

.status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--text-mute); margin-right: 5px; }

.lightbox-img { position: relative; max-width: 90vw; max-height: 88vh; border-radius: 10px; box-shadow: var(--shadow); }
.lightbox-close {
  position: absolute; top: 22px; right: 26px;
  width: 36px; height: 36px; border-radius: 50%;
  border: none; background: rgba(255, 255, 255, .16);
  color: #fff; font-size: 16px; cursor: pointer;
}

.toast {
  position: fixed; left: 50%; bottom: 34px;
  transform: translateX(-50%);
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 10px 20px;
  border-radius: 999px;
  box-shadow: var(--shadow);
  font-size: 13px;
  z-index: 200;
  animation: rise .22s ease;
}
@keyframes rise { from { opacity: 0; transform: translate(-50%, 10px); } }

@media (max-width: 700px) {
  .page { padding: 22px 16px 70px; }
  .article-title { font-size: 25px; }
  .article-body { font-size: 16.5px; }
  .editor-bar { flex-wrap: wrap; }
  .admin-actions { margin-left: 0; }
}

<script>
/* =========================================================
 * storage.js —— 统一存储层
 * 两种后端，接口完全一致：
 *   LocalStore : localStorage(文章数据) + IndexedDB(图片二进制)
 *   CloudStore : Supabase —— PostgREST(文章数据) + Storage(图片)
 * 上层只依赖 Store.xxx，切换后端无需改动界面代码。
 *
 * 文章模型 post = {
 *   id, title, html, cover, tags[], createdAt, updatedAt,
 *   published, history:[{title, html, at}]
 * }
 * ========================================================= */
(function (global) {
  'use strict';

  const NS = 'notebook:v1';
  const LS_POSTS = NS + ':posts';
  const LS_SETTINGS = NS + ':settings';
  const LS_CONFIG = NS + ':config';
  const LS_AUTH = NS + ':authsess';

  /* ---------------- 小工具 ---------------- */
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function readLS(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      console.warn('[storage] 读取失败:', key, e);
      return fallback;
    }
  }

  function writeLS(key, val, silent) {
    try {
      localStorage.setItem(key, JSON.stringify(val));
      return true;
    } catch (e) {
      console.error('[storage] 写入失败:', key, e);
      if (!silent) alert('本地存储空间不足，建议清理旧文章或改用云端存储。');
      return false;
    }
  }

  /* ---------------- IndexedDB 封装 ----------------
     images   图片二进制
     articles 文章正文（localStorage 只有 ~5MB，长篇小说几篇就撑爆，正文必须放这里） */
  const idb = {
    _db: null,
    open() {
      if (this._db) return Promise.resolve(this._db);
      if (typeof indexedDB === 'undefined') return Promise.reject(new Error('当前环境没有 IndexedDB'));
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(NS, 2);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('images')) db.createObjectStore('images');
          if (!db.objectStoreNames.contains('articles')) db.createObjectStore('articles');
        };
        req.onsuccess = () => { this._db = req.result; resolve(this._db); };
        req.onerror = () => reject(req.error);
      });
    },
    async put(key, val, store) {
      const db = await this.open();
      const name = store || 'images';
      return new Promise((resolve, reject) => {
        const tx = db.transaction(name, 'readwrite');
        tx.objectStore(name).put(val, key);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    },
    async get(key, store) {
      const db = await this.open();
      const name = store || 'images';
      return new Promise((resolve, reject) => {
        const tx = db.transaction(name, 'readonly');
        const r = tx.objectStore(name).get(key);
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
    },
    async del(key, store) {
      const db = await this.open();
      const name = store || 'images';
      return new Promise((resolve, reject) => {
        const tx = db.transaction(name, 'readwrite');
        tx.objectStore(name).delete(key);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }
  };

  /* ---------------- 本地后端 ---------------- */
  const LocalStore = {
    mode: 'local',
    label: '本地浏览器',
    _blobUrls: new Map(),

    async init() { return true; },

    async loadAll() {
      const posts = readLS(LS_POSTS, []);
      /* 老数据兼容：正文原本存在 localStorage 里，这里顺手挪进 IndexedDB，
         只留索引。IndexedDB 不可用（如某些隐私模式）时保持原样，功能不受影响。 */
      let migrated = false;
      for (const p of posts) {
        if (typeof p.html === 'string') {
          try {
            await idb.put(p.id, p.html, 'articles');
            delete p.html;
            migrated = true;
          } catch (e) { /* 没有 IDB 就留在 localStorage */ }
        }
      }
      if (migrated) writeLS(LS_POSTS, posts);
      return { posts };
    },

    async putPost(post) {
      const posts = readLS(LS_POSTS, []);
      const lean = Object.assign({}, post);
      /* 正文进 IndexedDB（容量几百 MB）；localStorage 只存索引，
         这样长篇小说再多也不会撞 5MB 上限 */
      if (typeof lean.html === 'string') {
        try {
          await idb.put(lean.id, lean.html, 'articles');
          delete lean.html;
        } catch (e) { /* 没有 IDB 时保留正文，老行为 */ }
      }
      const i = posts.findIndex(p => p.id === lean.id);
      if (i >= 0) posts[i] = lean; else posts.unshift(lean);
      /* 写不进去必须抛错，否则调用方会误以为保存成功 */
      if (!writeLS(LS_POSTS, posts, true)) throw new Error('本机浏览器存储空间不足。请改用云端存储，或先删掉一些旧文章；也可以点「导出备份」把内容存到硬盘上。');
    },

    async getPost(id) {
      const meta = readLS(LS_POSTS, []).find(p => p.id === id) || null;
      if (!meta) return null;
      if (typeof meta.html !== 'string') {
        try {
          const html = await idb.get(id, 'articles');
          if (typeof html === 'string') meta.html = html;
        } catch (e) { /* 没有 IDB：保持无正文，由上层下载/提示 */ }
      }
      return meta;
    },

    async removePost(id) {
      writeLS(LS_POSTS, readLS(LS_POSTS, []).filter(p => p.id !== id));
      try { await idb.del(id, 'articles'); } catch (e) { /* 忽略 */ }
    },

    async putImage(id, blob) {
      await idb.put(id, blob);
      const old = this._blobUrls.get(id);
      if (old) URL.revokeObjectURL(old);
      this._blobUrls.set(id, URL.createObjectURL(blob));
    },

    async imageUrl(id) {
      if (this._blobUrls.has(id)) return this._blobUrls.get(id);
      const blob = await idb.get(id);
      if (!blob) return null;
      const url = URL.createObjectURL(blob);
      this._blobUrls.set(id, url);
      return url;
    },

    async removeImage(id) {
      await idb.del(id);
      const old = this._blobUrls.get(id);
      if (old) { URL.revokeObjectURL(old); this._blobUrls.delete(id); }
    },

    async imageBlob(id) { return idb.get(id); }
  };

  /* ---------------- 云端后端（Supabase） ----------------
   * 需要用户在「云端设置」中填写：
   *   Project URL : https://xxxxx.supabase.co
   *   anon key    : eyJhbGci...
   *   bucket      : notebook-images （需设为 public）
   * 建表 SQL 见 README.md
   * --------------------------------------------------- */
  const CloudStore = {
    mode: 'cloud',
    label: '云端 (Supabase)',
    cfg: null,

    async init() {
      this.cfg = readLS(LS_CONFIG, null);
      return !!(this.cfg && this.cfg.url && this.cfg.key);
    },

    _headers(extra) {
      const sess = readLS(LS_AUTH, null);
      const token = (sess && sess.access_token) || this.cfg.key;
      return Object.assign({
        'apikey': this.cfg.key,
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      }, extra || {});
    },

    /* ---------- Supabase Auth（管理员登录，站点公开后唯一的写入口） ---------- */
    authSession() { return readLS(LS_AUTH, null); },

    _saveAuth(sess) { writeLS(LS_AUTH, sess || null); },

    authed() {
      const s = this.authSession();
      return !!(s && (s.access_token || s.refresh_token));
    },

    authEmail() {
      const s = this.authSession();
      return (s && s.email) || '';
    },

    async signIn(email, password) {
      const res = await fetch(this.cfg.url.replace(/\/+$/, '') + '/auth/v1/token?grant_type=password', {
        method: 'POST',
        headers: { 'apikey': this.cfg.key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: String(email).trim(), password })
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(d.error_description || d.msg || d.error || ('登录失败 HTTP ' + res.status));
      }
      this._saveAuth({
        access_token: d.access_token,
        refresh_token: d.refresh_token,
        expires_at: Date.now() + (d.expires_in || 3600) * 1000,
        email: d.user && d.user.email
      });
      return d;
    },

    async refreshAuth() {
      const s = this.authSession();
      if (!s || !s.refresh_token) throw new Error('登录已过期，请重新登录');
      const res = await fetch(this.cfg.url.replace(/\/+$/, '') + '/auth/v1/token?grant_type=refresh_token', {
        method: 'POST',
        headers: { 'apikey': this.cfg.key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: s.refresh_token })
      });
      if (!res.ok) { this._saveAuth(null); throw new Error('登录已过期，请重新登录'); }
      const d = await res.json();
      const next = {
        access_token: d.access_token,
        refresh_token: d.refresh_token,
        expires_at: Date.now() + (d.expires_in || 3600) * 1000,
        email: (d.user && d.user.email) || s.email
      };
      this._saveAuth(next);
      return next;
    },

    signOut() { this._saveAuth(null); },

    async _json(path, opts, retried) {
      const res = await fetch(this.cfg.url.replace(/\/+$/, '') + path,
        Object.assign({ headers: this._headers() }, opts || {}));
      if (res.status === 401 && !retried && this.authSession() && this.authSession().refresh_token) {
        await this.refreshAuth();
        return this._json(path, opts, true);
      }
      if (!res.ok) {
        const txt = await res.text().catch(() => '');
        throw new Error('云端请求失败 ' + res.status + '：' + txt.slice(0, 300));
      }
      const txt = await res.text();
      return txt ? JSON.parse(txt) : null;
    },

    async test() {
      await this._json('/rest/v1/nb_posts?select=id&limit=1');
      return true;
    },

    /* 静态镜像：托管页面旁的 posts.json / img/ 目录（GitHub Pages 提供）。
       有些网络访问不到 Supabase，这时用它兜底，读者依然能看到文章。 */
    staticMirror: null,

    setStaticMirror(data) {
      /* 允许"0 篇文章但有站点设置"的快照：全部删光时也要保留名称/简介/头像 */
      const ok = data && Array.isArray(data.posts) && (data.posts.length > 0 || data.site);
      let posts = ok ? data.posts.slice() : [];
      /* 墓碑：删除过的文章不再出现，除非它比墓碑更新（说明别处又发过同名新稿） */
      const del = (data && data.deleted) || {};
      posts = posts.filter(p => {
        const d = del[p.id];
        return !(d && d >= (p.updatedAt || 0));
      });
      this.staticMirror = ok ? {
        posts,
        imgBase: data.imgBase || 'img/',
        artBase: data.artBase || 'articles/',
        version: data.v || 1,
        images: new Set(Array.isArray(data.images) ? data.images : []),
        dataUris: data.dataUris || null,
        site: data.site || null,
        categories: Array.isArray(data.categories) ? data.categories.slice() : [],
        deleted: del
      } : null;
      /* 把快照里的分类也存到 localStorage，让本机第一次访问也能选到全部分类 */
      if (this.staticMirror && this.staticMirror.categories.length) {
        try {
          const key = 'notebook:v1:categories';
          const cur = JSON.parse(localStorage.getItem(key) || '[]') || [];
          const merged = [...new Set([...cur, ...this.staticMirror.categories])];
          localStorage.setItem(key, JSON.stringify(merged));
        } catch (e) { /* ignore */ }
      }
      return !!this.staticMirror;
    },

    /* 快照里带的站点设置（名称/简介/头像），供品牌区在没有本地自定义时使用 */
    mirrorSite() { return (this.staticMirror && this.staticMirror.site) || null; },

    hasStatic() { return !!(this.staticMirror && this.staticMirror.posts.length); },

    /* 快照按需加载正文：v2 的 posts.json 只带索引（标题/摘要/时间），
       正文在 articles/<id>.json，读者点开哪篇才拉哪篇。
       v1 老格式（正文内联在 posts 里）继续直接可用，不需要额外请求。 */
    async staticArticle(id) {
      const m = this.staticMirror;
      if (!m) return null;
      const p = m.posts.find(x => x.id === id);
      if (p && typeof p.html === 'string' && p.html) return p;
      const base = m.artBase || 'articles/';
      try {
        const res = await fetch(base + encodeURIComponent(id) + '.json');
        if (!res.ok) return null;
        const d = await res.json();
        if (d && typeof d.html === 'string') {
          if (p) Object.assign(p, { html: d.html, history: d.history || p.history });
          return d;
        }
      } catch (e) { /* 离线且未缓存：交给上层提示 */ }
      return null;
    },

    /* 分类不单独建列：复用已有的 tags 数组，元素形如 "cat:教程"。
       这样数据库不用迁移（nb_posts 表只有 id/title/html/cover/tags/createdAt/
       updatedAt/published/history 这些列），旧数据也天然兼容。 */
    CAT_PREFIX: 'cat:',

    _catFromTags(tags) {
      const t = (tags || []).find(x => typeof x === 'string' && x.indexOf(this.CAT_PREFIX) === 0);
      return t ? t.slice(this.CAT_PREFIX.length) : '';
    },

    _normalizePost(row) {
      if (!row) return row;
      const out = Object.assign({}, row);
      /* 若以后真的加了 category 列，优先用列；否则从 tags 里取 */
      if (!out.category) out.category = this._catFromTags(row.tags) || '';
      return out;
    },

    async loadAll() {
      const rows = await this._json('/rest/v1/nb_posts?select=*&order=updatedAt.desc');
      const posts = (rows || []).map(r => this._normalizePost(r));
      return { posts };
    },

    /* 单篇完整正文：索引模式下列表不带 html，需要时单独查这一篇 */
    async getPost(id) {
      const rows = await this._json('/rest/v1/nb_posts?select=*&id=eq.' +
        encodeURIComponent(id) + '&limit=1');
      return this._normalizePost((rows && rows[0]) || null);
    },

    async putPost(post, drop) {
      const dropSet = new Set(drop || []);
      const row = Object.assign({}, post);
      const cat = String(row.category || '').trim();
      delete row.category;                    /* 表里没有这一列，只放 tags */
      const tags = (Array.isArray(row.tags) ? row.tags : [])
        .filter(t => !(typeof t === 'string' && t.indexOf(this.CAT_PREFIX) === 0));
      if (cat) tags.push(this.CAT_PREFIX + cat);
      row.tags = tags;
      dropSet.forEach(k => delete row[k]);

      try {
        await this._json('/rest/v1/nb_posts', {
          method: 'POST',
          headers: this._headers({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
          body: JSON.stringify(row)
        });
      } catch (e) {
        /* 万一表结构又变了（多了/少了别的列），去掉那个未知列重试一次，
           而不是整篇丢掉 —— 至少保住正文和分类 */
        const m = /Could not find the '([^']+)' column/i.exec(e && e.message ? e.message : '');
        if (m && dropSet.size < 6 && !dropSet.has(m[1])) {
          dropSet.add(m[1]);
          return this.putPost(post, [...dropSet]);
        }
        throw e;
      }
    },

    async removePost(id) {
      await this._json('/rest/v1/nb_posts?id=eq.' + id, { method: 'DELETE' });
    },

    async putImage(id, blob, retried) {
      const path = this.cfg.bucket + '/' + id;
      const res = await fetch(this.cfg.url.replace(/\/+$/, '') + '/storage/v1/object/' + path, {
        method: 'POST',
        headers: {
          'apikey': this.cfg.key,
          'Authorization': 'Bearer ' + this._headers().Authorization.slice(7),
          'Content-Type': blob.type || 'image/jpeg',
          'x-upsert': 'true'
        },
        body: blob
      });
      if (res.status === 401 && !retried && this.authSession() && this.authSession().refresh_token) {
        await this.refreshAuth();
        return this.putImage(id, blob, true);
      }
      if (!res.ok) {
        const txt = await res.text().catch(() => '');
        throw new Error('图片上传失败 ' + res.status + '：' + txt.slice(0, 300));
      }
    },

    async imageUrl(id) {
      const m = this.staticMirror;
      if (m && m.dataUris && m.dataUris[id]) return m.dataUris[id];
      if (m && m.images.has(id)) return m.imgBase + encodeURIComponent(id);
      const path = (this.cfg.bucket || 'notebook-images') + '/' + id;
      return this.cfg.url.replace(/\/+$/, '') + '/storage/v1/object/public/' + path;
    },

    async removeImage(id, retried) {
      const path = this.cfg.bucket + '/' + id;
      const res = await fetch(this.cfg.url.replace(/\/+$/, '') + '/storage/v1/object/' + path, {
        method: 'DELETE',
        headers: { 'apikey': this.cfg.key, 'Authorization': 'Bearer ' + this._headers().Authorization.slice(7) }
      });
      if (res.status === 401 && !retried && this.authSession() && this.authSession().refresh_token) {
        await this.refreshAuth();
        return this.removeImage(id, true);
      }
    },

    async imageBlob(id) {
      const res = await fetch(await this.imageUrl(id));
      if (!res.ok) return null;
      return res.blob();
    },

    /* 发布整站：把单文件 HTML 传到 public 桶，得到一个所有人可访问的网址。
       走标准 /object 接口（非 tus），用已登录身份。
       注意：必须先 DELETE 旧对象再全新上传，不能用 x-upsert 覆盖——
       upsert 只更新数据库记录，底层对象的 Content-Type 仍是首次上传时的值
       （曾导致公网打开显示 HTML 源码：实际返回 text/plain）。 */
    async publishFile(name, text, contentType, retried) {
      const path = (this.cfg.bucket || 'notebook-images') + '/' + name;
      const base = this.cfg.url.replace(/\/+$/, '');
      const auth = {
        'apikey': this.cfg.key,
        'Authorization': 'Bearer ' + this._headers().Authorization.slice(7)
      };
      await fetch(base + '/storage/v1/object/' + path, { method: 'DELETE', headers: auth }).catch(() => {});
      const res = await fetch(base + '/storage/v1/object/' + path, {
        method: 'POST',
        headers: Object.assign({}, auth, {
          'Content-Type': contentType || 'text/html; charset=utf-8',
          'cache-control': '0'
        }),
        body: text
      });
      if (res.status === 401 && !retried && this.authSession() && this.authSession().refresh_token) {
        await this.refreshAuth();
        return this.publishFile(name, text, contentType, true);
      }
      if (!res.ok) {
        const txt = await res.text().catch(() => '');
        throw new Error('发布失败 ' + res.status + '：' + txt.slice(0, 300));
      }
      return this.cfg.url.replace(/\/+$/, '') + '/storage/v1/object/public/' + path;
    },

  };

  /* ---------------- 对外统一出口 ---------------- */
  const Store = {
    mode: 'local',

    get impl() { return this.mode === 'cloud' ? CloudStore : LocalStore; },

    async init() {
      const cfg = readLS(LS_CONFIG, null);
      this.mode = (cfg && cfg.url && cfg.key && cfg.enabled) ? 'cloud' : 'local';
      return this.impl.init();
    },

    async switchTo(mode) {
      const cfg = readLS(LS_CONFIG, null) || {};
      cfg.enabled = (mode === 'cloud');
      writeLS(LS_CONFIG, cfg);
      this.mode = cfg.enabled && cfg.url && cfg.key ? 'cloud' : 'local';
      return this.impl.init();
    },

    async loadAll() { return this.impl.loadAll(); },
    setStaticMirror(d) { return CloudStore.setStaticMirror(d); },
    hasStatic() { return CloudStore.hasStatic(); },
    mirrorSite() { return CloudStore.mirrorSite(); },
    staticPosts() { const m = CloudStore.staticMirror; return m ? m.posts : []; },
    async staticArticle(id) { return CloudStore.staticArticle(id); },
    async putPost(p) { return this.impl.putPost(p); },
    async getPost(id) { return this.impl.getPost ? this.impl.getPost(id) : null; },
    async removePost(id) { return this.impl.removePost(id); },
    async putImage(id, blob) { return this.impl.putImage(id, blob); },
    async imageUrl(id) { return this.impl.imageUrl(id); },
    async removeImage(id) { return this.impl.removeImage(id); },
    async imageBlob(id) { return this.impl.imageBlob(id); },
    async publishFile(name, text, contentType) {
      if (this.mode !== 'cloud') throw new Error('请先启用云端存储');
      return CloudStore.publishFile(name, text, contentType);
    },
    test() { return CloudStore.test(); },

    /* Supabase Auth（云端模式的管理员登录） */
    signIn(email, pw) { return CloudStore.signIn(email, pw); },
    signOut() { CloudStore.signOut(); },
    authed() { return this.mode === 'cloud' ? CloudStore.authed() : false; },
    authEmail() { return CloudStore.authEmail(); },

    /* 密码哈希：云端模式改用 Supabase Auth（邮箱+密码），不再使用自管密码；
       本地模式仍存 localStorage */
    async getPassHash() {
      if (this.mode === 'cloud') return '';
      return this.getSettings().passHash || '';
    },

    async setPassHash(h) {
      if (this.mode === 'cloud') return;   // 云端模式由 Supabase Auth 管理
      const s = this.getSettings();
      s.passHash = h;
      this.saveSettings(s);
    },

    /* 默认预填本机用户的 Supabase 项目地址与 publishable key（前端公开密钥，等同旧 anon key），
       换项目直接覆盖即可 */
    getConfig() {
      return readLS(LS_CONFIG, {
        enabled: false,
        url: 'https://nlxjbeooxqovoukbdmqr.supabase.co',
        key: 'sb_publishable_Hvf84ZCZ580Ioyq6wi6vHg_WpSF32VO',
        bucket: 'notebook-images'
      });
    },
    saveConfig(cfg) { writeLS(LS_CONFIG, cfg); },

    /* 站点配置（站点名、简介、管理密码哈希）只存本地，不同步到云端 */
    getSettings() {
      return readLS(LS_SETTINGS, { siteName: '我的文字站', intro: '', passHash: '' });
    },
    saveSettings(s) { writeLS(LS_SETTINGS, s); },

    uid
  };

  global.Store = Store;
})(window);

</script>
<script>
/* =========================================================
 * app.js —— 面向读者的阅读站 + 面向作者的更新后台
 * 视图：#/(列表)  #/p/<id>(全文)  #/admin(后台)  #/edit/<id>(编辑)
 * 每次保存都会把旧版本存入历史，随时可回滚——更新内容不会弄丢旧稿。
 * ========================================================= */
(function () {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const uid = Store.uid;

  const state = {
    posts: [],
    current: null,     // 正在编辑的文章
    authed: false,
    homeCat: '',       // 首页分类筛选（空=全部）
    catFilter: '',     // 后台分类筛选
    _selected: new Set(),  // 后台批量选中的文章 id
    bodyCache: new Map()   // 已拉到的正文（id -> html），避免重复请求
  };

  /* =============== 工具 =============== */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fmtDate(ts) {
    const d = new Date(ts);
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;
  }

  function fmtFull(ts) {
    const d = new Date(ts);
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function toast(msg) {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2400);
  }

  function openDialog(title, bodyHTML, buttons) {
    $('#dialogTitle').textContent = title;
    $('#dialogBody').innerHTML = bodyHTML || '';
    const foot = $('#dialogFoot');
    foot.innerHTML = '';
    (buttons || []).forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'btn ' + (b.cls || '');
      btn.textContent = b.text;
      btn.onclick = b.onClick;
      foot.appendChild(btn);
    });
    $('#dialog').hidden = false;
  }

  function closeDialog() { $('#dialog').hidden = true; }

  /* 清理粘贴进来的危险内容 */
  function sanitize(html) {
    const d = document.createElement('div');
    d.innerHTML = html || '';
    d.querySelectorAll('script,style,iframe,object,embed,link,meta,form').forEach(n => n.remove());
    d.querySelectorAll('*').forEach(n => {
      [...n.attributes].forEach(a => {
        if (/^on/i.test(a.name)) n.removeAttribute(a.name);
        const v = (a.value || '').replace(/\s/g, '').toLowerCase();
        if ((a.name === 'src' || a.name === 'href') && v.startsWith('javascript:')) n.removeAttribute(a.name);
      });
    });
    return d.innerHTML;
  }

  function plainText(html, limit) {
    const d = document.createElement('div');
    d.innerHTML = html || '';
    const t = (d.textContent || '').replace(/\s+/g, ' ').trim();
    return limit && t.length > limit ? t.slice(0, limit) + '…' : t;
  }

  /* =============== 按需加载正文 ===============
     静态快照只带索引（标题/摘要/时间），正文在 articles/<id>.json。
     这样首屏体积与"总字数"解耦：100 万字和 1000 字首屏一样快。
     顺序：内存缓存 → 文章对象已带 → 静态单篇文件 → 云端单篇。 */
  async function ensureBody(p) {
    if (!p) return '';
    if (typeof p.html === 'string' && p.html) {
      state.bodyCache.set(p.id, p.html);
      return p.html;
    }
    if (state.bodyCache.has(p.id)) {
      p.html = state.bodyCache.get(p.id);
      return p.html;
    }

    let html = '';
    try {
      const art = await Store.staticArticle(p.id);
      if (art && typeof art.html === 'string') html = art.html;
    } catch (e) { /* 离线且未缓存，走下一步 */ }

    if (!html) {
      try {
        const full = await Store.getPost(p.id);
        if (full && typeof full.html === 'string') html = full.html;
      } catch (e) { /* 本地 / 云端都不可达，交给调用方提示 */ }
    }

    if (html) {
      p.html = html;
      state.bodyCache.set(p.id, html);
    }
    return html;
  }

  /* 列表摘要：新索引自带 excerpt（生成快照时算好，省得为摘要去拉全文） */
  function postExcerpt(p, limit) {
    if (p && p.excerpt) {
      return limit && p.excerpt.length > limit ? p.excerpt.slice(0, limit) + '…' : p.excerpt;
    }
    return plainText(p && p.html, limit);
  }

  /* =============== 密码 =============== */
  function legacyHash(pw) {
    let h = 5381;
    const s = String(pw) + ':nb';
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    return 'legacy:' + h.toString(16);
  }

  async function sha256(pw) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(pw) + ':nb'));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }

  /* 密码哈希要存到云端，用 PBKDF2 而非裸 SHA-256：
     随机盐 + 15 万次迭代，被拖库后离线爆破成本高得多。
     格式：pbkdf2$<迭代次数>$<盐base64>$<派生密钥base64> */
  const PBKDF2_ITER = 150000;

  function toB64(bytes) {
    let s = '';
    for (const b of bytes) s += String.fromCharCode(b);
    return btoa(s);
  }

  function fromB64(str) {
    const bin = atob(str);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function pbkdf2(pw, salt, iter) {
    const key = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(String(pw)), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, key, 256);
    return new Uint8Array(bits);
  }

  async function makeHash(pw) {
    if (window.crypto && crypto.subtle && window.isSecureContext) {
      try {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const dk = await pbkdf2(pw, salt, PBKDF2_ITER);
        return 'pbkdf2$' + PBKDF2_ITER + '$' + toB64(salt) + '$' + toB64(dk);
      } catch (e) { /* 落到 legacy */ }
    }
    return legacyHash(pw);
  }

  async function verifyPassword(pw) {
    const h = await Store.getPassHash();
    if (!h) return null;                                 // 尚未设置
    if (h.startsWith('legacy:')) return h === legacyHash(pw);
    if (h.startsWith('pbkdf2$')) {
      try {
        const [, it, saltS, dkS] = h.split('$');
        const dk = await pbkdf2(pw, fromB64(saltS), parseInt(it, 10) || PBKDF2_ITER);
        return toB64(dk) === dkS;
      } catch (e) { return false; }
    }
    /* 旧格式：裸 sha256（历史数据兼容） */
    if (window.crypto && crypto.subtle && window.isSecureContext) {
      try { return h === await sha256(pw); } catch (e) { return false; }
    }
    return false;                                        // 存的是强哈希但当前环境不支持
  }

  /* 用旧格式登录成功后，静默升级为 PBKDF2 存回（仅本地模式） */
  async function upgradeHashIfNeeded(pw) {
    if (Store.mode === 'cloud') return;
    const h = await Store.getPassHash();
    if (!h || h.startsWith('pbkdf2$')) return;
    try { await Store.setPassHash(await makeHash(pw)); } catch (e) { /* 本地失败忽略 */ }
  }

  /* =============== 管理员登录 ===============
   * 本地模式：本机自管密码（PBKDF2 哈希）
   * 云端模式：Supabase Auth 邮箱+密码，RLS 只放行这个账号写数据 */
  function isAuthed() {
    if (state.authed) return true;
    if (Store.mode === 'cloud' && Store.authed()) { state.authed = true; return true; }
    if (sessionStorage.getItem('notebook:v1:auth') === '1') { state.authed = true; return true; }
    return false;
  }

  /* =============== GitHub 令牌登录 ===============
     有些网络访问不到 Supabase（登不上、也写不了库）。这条通道只用 GitHub：
     校验令牌归属 → 文章存本机 → 点「同步到静态站」直接写进 GitHub 仓库。 */
  const GH_OWNER = 'youxiang-wanjuwu';

  async function importSnapshotToLocal() {
    if (Store.mode !== 'local') return 0;
    const snap = window.__NB_SNAPSHOT__;
    if (!snap || !snap.posts || !snap.posts.length) return 0;
    const cur = (await Store.loadAll()).posts || [];
    const map = new Map(cur.map(p => [p.id, p]));
    let n = 0;
    for (const p of snap.posts) {
      const old = map.get(p.id);
      /* 只补新的、更新的，别覆盖本机刚写的草稿 */
      if (!old || (p.updatedAt || 0) > (old.updatedAt || 0)) { await Store.putPost(p); n++; }
    }
    return n;
  }

  /* 云端连不上时自动切到本机模式，避免每一步保存都报错 */
  async function ensureUsableMode() {
    if (Store.mode !== 'cloud') { await importSnapshotToLocal(); return; }
    try {
      await Store.test();
      return;
    } catch (e) {
      await Store.switchTo('local');
      await importSnapshotToLocal();
    }
  }

  /* 网络类错误（fetch 直接失败 / 超时），与"数据写错"区分开。
     只有前者才值得降级，后者降级也没用。 */
  function isNetworkError(e) {
    const m = ((e && e.message) || '') + ' ' + ((e && e.name) || '');
    if (/^\D*\d{3}/.test(m)) return false;          /* 形如"云端请求失败 400：..."属服务端拒绝 */
    return /Failed to fetch|NetworkError|Load failed|ERR_NETWORK|ERR_CONNECTION|network|offline|timeout|timed out|ECONN|TLS|socket/i.test(m);
  }

  /* 统一写入入口：云端失败（仅网络原因）时自动切本机再写，
     保证用户写了几万字的长文不会因为一次网络抖动整篇丢掉。
     返回 'cloud' | 'local'，方便调用方提示用户。 */
  async function persistPost(post) {
    /* 云端瞬时抖动（TLS 重置、超时、5xx）先退避重试两次，别第一次失败就往本机退；
       三次都不通才判定"这台设备连不上云端"，切本机继续存 —— 内容一律不丢。 */
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        await Store.putPost(post);
        return Store.mode;
      } catch (e) {
        if (!isNetworkError(e)) throw e;
        if (attempt < 2) {
          await new Promise(r => setTimeout(r, 400 * Math.pow(2, attempt)));
          continue;
        }
        if (Store.mode === 'cloud') {
          await ensureUsableMode();                  /* 切到本机 + 补快照文章 */
          await Store.putPost(post);
          return 'local';
        }
        throw e;
      }
    }
    return Store.mode;
  }

  /* 本机已保存令牌且仍然有效 → 免密登录 */
  async function trySavedGithubLogin() {
    const t = (localStorage.getItem(GH_TOKEN_KEY) || '').trim();
    if (!t) return false;
    try {
      const res = await fetch('https://api.github.com/user', {
        headers: { 'Authorization': 'Bearer ' + t, 'Accept': 'application/vnd.github+json' }
      });
      if (!res.ok) return false;
      const u = await res.json();
      if (u.login && u.login !== GH_OWNER) return false;
      state.authed = true;
      sessionStorage.setItem('notebook:v1:auth', '1');
      return true;
    } catch (e) { return false; }
  }

  async function githubLogin(onOk) {
    const input = window.prompt(
      '粘贴 GitHub 令牌（ghp_ 开头，勾选 repo 权限生成的那种）\n\n' +
      '适用于这台设备访问不到 Supabase 的情况：登录后文章保存在本机，\n' +
      '点「同步到静态站」直接写进 GitHub，读者即可看到。\n\n留空取消。');
    if (!input) return;
    const token = input.trim();
    if (!token) return;
    try {
      const res = await fetch('https://api.github.com/user', {
        headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' }
      });
      if (!res.ok) throw new Error('GitHub 不接受这个令牌（' + res.status + '）');
      const u = await res.json();
      if (u.login && u.login !== GH_OWNER) throw new Error('这个令牌属于 ' + u.login + '，不是本站所有者');
      localStorage.setItem(GH_TOKEN_KEY, token);
      state.authed = true;
      sessionStorage.setItem('notebook:v1:auth', '1');
      closeDialog();
      await ensureUsableMode();
      await load();
      toast('已登录（GitHub 令牌）');
      onOk();
    } catch (e) {
      toast('登录失败：' + (e && e.message ? e.message : e));
    }
  }

  async function askPassword(onOk) {
    if (Store.mode === 'cloud') {
      openDialog('管理员登录', `
        <p>站点公开后任何人可阅读；更新内容需要用管理员账号（Supabase Auth）登录。</p>
        <div class="field">
          <label>邮箱</label>
          <input id="admEmail" type="email" placeholder="you@example.com" autocomplete="username">
        </div>
        <div class="field">
          <label>密码</label>
          <input id="admPw" type="password" autocomplete="current-password">
        </div>
        <div class="hint" id="admErr"></div>
        <div class="tip">如果这台设备连不上 Supabase（登录一直失败），改用「GitHub 令牌登录」，
只需要能打开 GitHub，文章会直接写进站点仓库。</div>`, [
        { text: '取消', onClick: closeDialog },
        { text: 'GitHub 令牌登录', onClick: () => githubLogin(onOk) },

      return;
    }

    const h = await Store.getPassHash();
    if (!h) {
      openDialog('设置管理密码', `
        <p>首次进入后台，请先设置一个密码。之后在别的设备上打开本站，需要用这个密码才能更新文章。</p>
        <div class="field">
          <label>密码</label>
          <input id="pwNew" type="password" placeholder="至少 4 位">
        </div>
        <div class="field">
          <label>再输入一次</label>
          <input id="pwNew2" type="password">
        </div>
        <div class="tip">提示：${Store.mode === 'cloud' ? '密码会同步到云端，各设备通用；' : '密码保存在本机浏览器；'}无法找回，请自己记牢。</div>`, [
        { text: '取消', onClick: closeDialog },
        {
          text: '设置并进入', cls: 'primary', onClick: async () => {
            const a = $('#pwNew').value, b = $('#pwNew2').value;
            if (a.length < 4) { toast('密码至少 4 位'); return; }
            if (a !== b) { toast('两次输入不一致'); return; }
            try {
              await Store.setPassHash(await makeHash(a));
            } catch (e) {
              toast(e.message);
              return;
            }
            state.authed = true;
            sessionStorage.setItem('notebook:v1:auth', '1');
            closeDialog();
            onOk();
          }
        }
      ]);
      return;
    }

    openDialog('请输入管理密码', `
      <div class="field">
        <label>密码</label>
        <input id="pwInput" type="password" placeholder="输入管理密码">
      </div>`, [
      { text: '取消', onClick: closeDialog },
      {
        text: '进入', cls: 'primary', onClick: async () => {
          const val = $('#pwInput').value;
          const ok = await verifyPassword(val);
          if (!ok) { toast('密码不对'); return; }
          await upgradeHashIfNeeded(val);
          state.authed = true;
          sessionStorage.setItem('notebook:v1:auth', '1');
          closeDialog();
          onOk();

  function requireAuth(then) {
    if (isAuthed()) { then(); return; }
    /* 这台设备存过 GitHub 令牌：直接放行，不用每次都输密码 */
    trySavedGithubLogin().then(ok => {
      if (ok) {
        ensureUsableMode().then(() => load()).then(then);
        return;
      }
      askPassword(then);
    });
  }

  /* =============== 视图切换与路由 =============== */
  function showView(id) {
    ['viewHome', 'viewPost', 'viewAdmin', 'viewEditor'].forEach(v => {
      const el = document.getElementById(v);
      if (el) el.hidden = (v !== id);
    });
    const shown = document.querySelector('.page:not([hidden])');
    if (shown) shown.scrollTop = 0;
    window.scrollTo(0, 0);
  }

  function go(hash) { location.hash = hash; }

  /* =============== 分类管理 ===============
     分类是用户自建的标签，每个分类就是一个字符串。
     本机存 localStorage；随静态快照同步到云端 → 公网打开时也带着，
     但首篇文章用过的名会自动落入新建文章的候选（保证旧设备/新设备都能选到）。 */
  const CAT_KEY = 'notebook:v1:categories';
  const DEFAULT_CAT = '未分类';
  const SELECTED_CAT_KEY = 'notebook:v1:catFilter';   /* 后台当前筛选的分类 */
  state.catFilter = '';                                 /* 空 = 全部 */

  function loadCategories() {
    let cats = [];
    try { cats = JSON.parse(localStorage.getItem(CAT_KEY) || '[]') || []; }
    catch (e) { cats = []; }
    /* 默认分类始终在最前 */
    if (!cats.includes(DEFAULT_CAT)) cats.unshift(DEFAULT_CAT);
    /* 去重+去空 */
    cats = cats.filter((c, i, a) => c && a.indexOf(c) === i);
    return cats;
  }

  function saveCategories(arr) {
    localStorage.setItem(CAT_KEY, JSON.stringify(arr));
  }

  /* 把分类列表合并：默认分类始终保留 + 加入新分类 + 去重 */
  function addCategory(name) {
    name = String(name || '').trim();
    if (!name) return null;
    if (name.length > 24) { toast('分类名太长（最多 24 字）'); return null; }
    const cats = loadCategories();
    if (cats.includes(name)) return name;
    cats.push(name);
    saveCategories(cats);
    return name;
  }

  /* 删除分类：若该分类下还有文章，弹窗提示「自动改成默认分类」 */
  function removeCategory(name) {
    const cats = loadCategories();
    const i = cats.indexOf(name);
    if (i < 0) return;
    if (name === DEFAULT_CAT) { toast('默认分类不能删'); return; }
    cats.splice(i, 1);
    saveCategories(cats);
  }

  /* 把分类回填到首页/编辑器/筛选的 <datalist> */
  function fillCategoryOptions() {
    const dl = document.getElementById('catOptions');
    if (!dl) return;
    dl.innerHTML = loadCategories().map(c => '<option value="' + esc(c) + '">').join('');
  }

  /* 后台工具栏的 分类筛选 chips：点了切换 state.catFilter 并刷新后台 */
  function renderCatFilterRow() {
    const box = document.getElementById('catFilterRow');
    if (!box) return;
    const cats = loadCategories();
    const total = state.posts.length;
    /* 计数 */
    const cnt = {};
    cats.forEach(c => cnt[c] = 0);
    state.posts.forEach(p => { const c = p.category || DEFAULT_CAT; cnt[c] = (cnt[c] || 0) + 1; });

    const html = ['<span class="cf-label">分类筛选：</span>']
      .concat([
        `<button class="cat-chip ${!state.catFilter ? 'active' : ''}" data-cat="">全部<span class="cf-num">${total}</span></button>`,
        ...cats.map(c =>
          `<button class="cat-chip ${state.catFilter === c ? 'active' : ''}" data-cat="${esc(c)}">${esc(c)}<span class="cf-num">${cnt[c] || 0}</span></button>`
        )
      ]).join('');
    box.innerHTML = html;
    box.querySelectorAll('.cat-chip').forEach(b => {
      b.onclick = () => {
        state.catFilter = b.dataset.cat;
        sessionStorage.setItem(SELECTED_CAT_KEY, state.catFilter || '');
        renderCatFilterRow();
        renderAdmin(true);
      };
    });
  }

  /* 批量改分类弹窗 */
  function bulkChangeCategory() {
    const ids = Array.from(state._selected || []);
    if (!ids.length) { toast('没选中任何文章'); return; }
    const cats = loadCategories();
    const html = `
      <div class="field"><label>选中 ${ids.length} 篇，要改成哪个分类？</label>
        <input id="bulkCat" list="cat-options" placeholder="选择或输入新分类">
        <datalist id="cat-options">${cats.map(c => '<option value="' + esc(c) + '">').join('')}</datalist>
      </div>
      <div class="tip">支持自定义新分类名（保存时会自动加入分类库）。</div>`;
    openDialog('批量改分类', html, [
      { text: '取消', onClick: closeDialog },
      {
        text: '确认', cls: 'primary', onClick: async () => {
          const v = String($('#bulkCat').value || '').trim();
          if (!v) { toast('分类名不能为空'); return; }
          const nc = addCategory(v);
          if (!nc) return;
          const now = Date.now();
          let n = 0;
          for (const id of ids) {
            const p = state.posts.find(x => x.id === id);
            if (!p) continue;
            if ((p.category || DEFAULT_CAT) === nc && p.updatedAt === now) continue;
            p.category = nc;
            p.updatedAt = now;
            await persistPost(p);
            n++;
          }
          state._selected = new Set();
          sessionStorage.removeItem('notebook:v1:bulkSelected');
          fillCategoryOptions();
          await load();
          renderAdmin();
          closeDialog();
          toast(`已改 ${n} 篇 → ${nc}`);
        }
      }
    ]);
  }

  /* 分类管理弹窗：增删 */
  function categoryDialog() {
    const cats = loadCategories();
    const counts = {};
    cats.forEach(c => counts[c] = 0);
    state.posts.forEach(p => {
      const c = p.category || DEFAULT_CAT;
      counts[c] = (counts[c] || 0) + 1;
    });

    const html = `
      <div class="field">
        <label>新建分类</label>
        <div style="display:flex;gap:8px">
          <input id="newCatInput" placeholder="分类名（最多 24 字）" style="flex:1">
          <button class="btn primary sm" id="addCatBtn">添加</button>
        </div>
      </div>
      <div class="field"><label>已有分类</label>
        <div class="cat-mgr-list">
          ${cats.map(c => `
            <div class="cat-mgr-item" data-cat="${esc(c)}">
              <span class="cm-name">${esc(c)}${c === DEFAULT_CAT ? ' <small style="color:var(--text-mute)">(默认)</small>' : ''}</span>
              <span class="cm-count">${counts[c] || 0} 篇</span>
              ${c === DEFAULT_CAT ? '' : `<button class="cm-del" title="删除分类（该分类下的文章会自动改为「${esc(DEFAULT_CAT)}」）">✕</button>`}
            </div>`).join('')}
        </div>
      </div>
      <div class="hint">删除非默认分类时，该分类下的所有文章会自动改成「${esc(DEFAULT_CAT)}」，避免出现「分类为空」的状态。</div>`;
    openDialog('分类管理', html, [
      { text: '完成', cls: 'primary', onClick: closeDialog }
    ]);

    $('#addCatBtn').onclick = () => {
      const v = String($('#newCatInput').value || '').trim();
      if (!v) { toast('分类名不能为空'); return; }
      const nc = addCategory(v);
      if (!nc) return;
      $('#newCatInput').value = '';
      fillCategoryOptions();
      renderCatFilterRow();
      categoryDialog();   /* 刷新弹窗里的列表 */
    };

    $('#dialogBody').querySelectorAll('.cm-del').forEach(b => {
      b.onclick = async () => {
        const c = b.parentElement.dataset.cat;
        const used = counts[c] || 0;
        const msg = used
          ? `分类「${c}」下还有 ${used} 篇文章。删除后这些文章会自动改为「${DEFAULT_CAT}」，确定继续？`
          : `删除分类「${c}」？`;
        if (!confirm(msg)) return;
        removeCategory(c);
        const now = Date.now();
        for (const p of state.posts) {
          if ((p.category || DEFAULT_CAT) !== c) continue;
          p.category = DEFAULT_CAT;
          p.updatedAt = now;
          await persistPost(p);
        }
        fillCategoryOptions();
        renderCatFilterRow();
        await load();
        renderAdmin();
        categoryDialog();
        toast(`已删除分类「${c}」`);
      };
    });
  }

  async function route() {
    const h = location.hash || '#/';
    if (h.startsWith('#/p/')) await showPost(h.slice(4));
    else if (h === '#/admin') { requireAuth(() => { showView('viewAdmin'); renderAdmin(); }); }
    else if (h.startsWith('#/edit/')) { requireAuth(() => openEditor(h.slice(7))); }
    else { showView('viewHome'); renderHome(); }
  }

  /* =============== 首页列表 =============== */
  /* 品牌信息合并：本机自定义优先；没自定义时用快照里带来的站点设置，
     这样在一台设备上改的名字/简介/头像，同步后其他设备也能看到 */
  function brandSettings() {
    const s = Store.getSettings();
    const out = { siteName: s.siteName || '', intro: s.intro || '', logo: s.logo || '' };
    const site = Store.mirrorSite && Store.mirrorSite();
    if (site) {
      const localDefault = !out.siteName || out.siteName === '我的文字站';
      if (localDefault) {
        if (site.siteName) out.siteName = site.siteName;
        if (!out.intro && site.intro) out.intro = site.intro;
      }
      if (!out.logo && site.logo) out.logo = site.logo;
    }
    return out;
  }

  function renderLogo(el, b) {
    if (b.logo) {
      el.textContent = '';
      const img = document.createElement('img');
      img.src = b.logo;
      img.alt = b.siteName || '';
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;';
      el.appendChild(img);
    } else {
      el.textContent = (b.siteName || '文').trim().charAt(0);
    }
  }

  function renderHome() {
    const b = brandSettings();
    $('#siteName').textContent = b.siteName || '我的文字站';
    $('#siteIntro').textContent = b.intro || '记录与分享';
    renderLogo($('#siteLogo'), b);
    document.title = b.siteName || '我的文字站';

    const allPublished = state.posts.filter(p => p.published)
      .sort((a, b) => b.updatedAt - a.updatedAt);
    const list = state.homeCat
      ? allPublished.filter(p => (p.category || DEFAULT_CAT) === state.homeCat)
      : allPublished;
    const box = $('#postList');
    box.innerHTML = '';
    $('#homeEmpty').hidden = list.length > 0;
    $('#homeIntro').textContent = b.intro || '';

    if (state.loadError) {
      const warn = document.createElement('div');
      warn.className = 'tip';
      warn.style.margin = '0 0 16px';
      warn.style.borderColor = '#ff6b6b';
      warn.textContent = state.loadError;
      box.appendChild(warn);
    } else if (state.fromMirror) {
      const tip = document.createElement('div');
      tip.className = 'tip';
      tip.style.margin = '0 0 16px';
      tip.style.opacity = '.7';
      tip.textContent = '当前显示的是站点内置快照，联网后会自动更新为最新内容。';
      box.appendChild(tip);
    }

    list.forEach(p => {
      const a = document.createElement('a');
      a.className = 'post-card';
      a.href = '#/p/' + p.id;
      const excerpt = postExcerpt(p, 140);
      const cat = p.category || DEFAULT_CAT;
      const html = `
        ${p.cover ? `<img class="pc-cover" data-cover="${p.cover}" alt="">` : ''}
        <h2>${esc(p.title || '未命名')}</h2>
        ${excerpt ? `<p class="pc-excerpt">${esc(excerpt)}</p>` : ''}
        <div class="pc-meta"><span class="ai-cat" style="margin-right:8px">${esc(cat)}</span><span>${fmtDate(p.updatedAt)}</span></div>`;
      a.innerHTML = html;
      box.appendChild(a);
      if (p.cover) {
        const im = a.querySelector('[data-cover]');
        Store.imageUrl(p.cover).then(u => { if (u) im.src = u; });
      }
    });

    renderHomeFilter(allPublished);
  }

  /* 读者侧的分类筛选条：只在真的存在多个分类时显示 */
  function renderHomeFilter(posts) {
    const bar = document.getElementById('homeCats');
    if (!bar) return;
    const cats = [...new Set(posts.map(p => p.category || DEFAULT_CAT))];
    if (cats.length < 2) { bar.innerHTML = ''; bar.style.display = 'none'; return; }
    bar.style.display = '';
    const active = state.homeCat && cats.includes(state.homeCat) ? state.homeCat : '';
    bar.innerHTML = [
      `<button class="cat-chip ${!active ? 'active' : ''}" data-hcat="">全部<span class="cf-num">${posts.length}</span></button>`,
      ...cats.map(c => {
        const n = posts.filter(p => (p.category || DEFAULT_CAT) === c).length;
        return `<button class="cat-chip ${active === c ? 'active' : ''}" data-hcat="${esc(c)}">${esc(c)}<span class="cf-num">${n}</span></button>`;
      })
    ].join('');
    bar.querySelectorAll('[data-hcat]').forEach(b => {
      b.onclick = () => {
        state.homeCat = b.dataset.hcat;
        renderHome();
      };
    });
  }

  /* =============== 文章全文页 =============== */
  async function showPost(id) {
    const p = state.posts.find(x => x.id === id);
    showView('viewPost');
    if (!p) {
      $('#articleTitle').textContent = '文章不存在';
      $('#articleMeta').textContent = '';
      $('#articleBody').innerHTML = '<p>这篇内容可能已被删除。 <a href="#/">返回列表</a></p>';
      $('#btnEditThis').hidden = true;
      return;
    }

    document.title = (p.title || '未命名') + ' · ' + (Store.getSettings().siteName || '我的文字站');
    $('#articleTitle').textContent = p.title || '未命名';
    $('#articleMeta').textContent =
      `更新于 ${fmtDate(p.updatedAt)}` + (p.history && p.history.length ? ` · 共 ${p.history.length + 1} 个版本` : '');

    const body = $('#articleBody');
    if (typeof p.html !== 'string') {
      body.innerHTML = '<p style="color:var(--text-mute)">正在加载正文…</p>';
    }
    const full = await ensureBody(p);
    if (!full) {
      body.innerHTML = '<p>正文暂时加载不出来（可能是这台设备的网络受限）。</p>' +
        '<p><button class="btn ghost sm" id="btnRetryBody">重试</button> ' +
        '<a class="btn ghost sm" href="#/">返回列表</a></p>';
      const rb = $('#btnRetryBody');
      if (rb) rb.onclick = () => showPost(p.id);
      return;
    }
    body.innerHTML = sanitize(full);
    // 图片按 id 还原真实地址
    const imgs = body.querySelectorAll('img[data-img-id]');
    for (const im of imgs) {
      const url = await Store.imageUrl(im.dataset.imgId);
      if (url) im.src = url;
      im.onclick = () => { $('#lightboxImg').src = url; $('#lightbox').hidden = false; };
    }

    $('#btnEditThis').hidden = !isAuthed();
    $('#btnEditThis').onclick = () => go('#/edit/' + p.id);
  }

  /* =============== 后台 =============== */
  function renderAdmin(keepSelection) {
    const s = Store.getSettings();
    $('#adminHint').innerHTML =
      `<span class="status-dot ${Store.mode === 'cloud' ? 'on' : 'off'}"></span>` +
      `存储位置：${Store.impl.label} · 共 ${state.posts.length} 篇（已发布 ${state.posts.filter(p => p.published).length} 篇）` +
      (Store.mode === 'cloud' && Store.authed()
        ? ` · 管理员：${esc(Store.authEmail())} <button class="btn ghost sm" id="btnSignOut">退出登录</button>`
        : '');

    const box = $('#adminList');
    box.innerHTML = '';
    const so = $('#btnSignOut');
    if (so) so.onclick = () => {
      Store.signOut();
      state.authed = false;
      sessionStorage.removeItem('notebook:v1:auth');
      renderAdmin();
      toast('已退出登录');
    };

    /* 已选文章：renderAdmin 可被多次调用，避免每次清掉选择 */
    if (!keepSelection) state._selected = state._selected || new Set();
    const sel = state._selected;

    fillCategoryOptions();
    renderCatFilterRow();

    /* 筛选 */
    let list = state.posts.slice().sort((a, b) => b.updatedAt - a.updatedAt);
    if (state.catFilter) list = list.filter(p => (p.category || DEFAULT_CAT) === state.catFilter);

    /* 批量操作条 */
    const bulk = $('#bulkToolbar');
    if (bulk) {
      bulk.hidden = sel.size === 0;
      $('#selCount').textContent = sel.size;
    }

    if (!list.length) {
      const emptyMsg = state.catFilter
        ? `「${state.catFilter}」分类下还没有文章`
        : '还没有文章';
      const emptySub = state.catFilter
        ? '点上方「全部」查看其它文章，或新建一篇选这个分类'
        : '点右上角「写新文章」开始。';
      box.innerHTML = `<div class="home-empty"><p>${esc(emptyMsg)}</p><span>${esc(emptySub)}</span></div>`;
      return;
    }

    list.forEach(p => {
      const item = document.createElement('div');
      item.className = 'admin-item';
      const cat = p.category || DEFAULT_CAT;
      const isSel = sel.has(p.id);
      item.innerHTML = `
        <div class="ai-check"><input type="checkbox" data-pick="${p.id}" ${isSel ? 'checked' : ''}></div>
        <div class="ai-main">
          <div class="ai-title">

          </div>
          <div class="ai-sub">更新 ${fmtFull(p.updatedAt)} · ${postExcerpt(p, 40) || '（无正文）'}</div>
        </div>
        <div class="ai-ops"></div>`;

      const ops = item.querySelector('.ai-ops');

      };

    /* 复选框 */
    box.querySelectorAll('[data-pick]').forEach(cb => {

    /* 单行点分类 → 弹窗改 */
    box.querySelectorAll('[data-one-cat]').forEach(el => {

        if (!p) return;
        const cats = loadCategories();

          <div class="field"><label>新分类</label>
            <input id="newCat" list="cat-options" value="${esc(p.category || DEFAULT_CAT)}" placeholder="选择或输入新分类">

          </div>
          <div class="hint">支持自定义新分类名（保存时会自动加入分类库）。</div>`;
        openDialog(`修改《${esc(p.title || '未命名')}》的分类`, html, [
          { text: '取消', onClick: closeDialog },

              await persistPost(p);
              closeDialog();
              fillCategoryOptions();
              renderCatFilterRow();

              toast(`已改成「${nc}」`);
            }
          }
